# 「그린」을 작성자 기계 밖에서 확인한다 — 로컬 그린 확인과 **같은 명령**만 돈다.
#
#   ruff · mypy · pytest   CLAUDE.md 「명령어」
#   scripts/verify.sh      README 가 처음 받은 사람에게 주는 한 줄 (가드 반증 · 생성물 대조 포함)
#
# API 키도 에이전트 CLI 도 쓰지 않는다 — 에이전트 층은 커밋된 묶음(results/agent/)을 다시 채점할 뿐이다.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      UV_LOCKED: "1"   # uv.lock 이 pyproject 와 어긋나면 고쳐 쓰지 않고 실패한다
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          version: "0.12.17"
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run mypy
      # 느린 시험을 코드로 짐작하지 않고 기록에서 읽는다 (H1)
      - run: uv run pytest --durations=25
      # 테스트가 추적 파일을 바꾸면 README 순서(pytest → verify.sh)에서 가드 반증이 건너뛰어진다
      # [실측 · c841360] CLI 테스트가 저장소의 진짜 그림을 덮어쓴 적이 있다
      - name: 테스트 뒤 작업 트리가 깨끗하다
        run: git status --porcelain && test -z "$(git status --porcelain)"

  # verify.sh 는 따로 돈다 — 한 작업에 두면 ubuntu 에서 pytest 약 15분 + 가드 반증 약 7분이 제한(20분)을 넘었다
  # [실측 · 097c370 · run 37197934394 취소]. 같은 명령을 그대로 돌고 나눠 동시에 돌 뿐이다.
  verify:
    name: verify (${{ matrix.os }} · ${{ matrix.shard }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        shard: ["1/2", "2/2"]
    runs-on: ${{ matrix.os }}
    # 가드 반증이 늘면서 ubuntu 15~17분이 됐고 느린 러너에서 20분에 두 번 끊겼다 — 같은 커밋을 다시 돌면
    # 17분 08초에 통과했다 [실측 · 2026-10-08 · 가드 153개 · run 37648226421]. 멈춤은 여전히 잡는다.
    # 그 뒤 main 에서 25분 28초 (가드 반증 22.7분) [실측 · 2026-10-08 · 가드 160개 · run 37704426652] —
    # 여기서 더 잘리면 한도를 올리지 말고 가드 반증을 matrix 로 나눈다 (가드는 H3 에 따라 계속 는다).
    # 25분 넘김이 되풀이돼 [실측 · 11c693b 27분 29초 · 가드 192개 · run 37736474729] 가드 반증을 조각 둘로 나눴다 —
    # verify.sh 는 그대로 돌고 그 안의 falsify.sh 만 FALSIFY_SHARD 조각을 돈다 (합집합 = 전체는 시험이 본다 · 교훈 #71).
    timeout-minutes: 30
    env:
      UV_LOCKED: "1"
      FALSIFY_SHARD: ${{ matrix.shard }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          version: "0.12.17"
      - run: uv sync
      # 🔴 verify.sh 는 트리가 더러우면 가드 반증(falsify)을 건너뛰고도 exit 0 이다.
      #    그 앞에 추적 파일을 고치는 단계를 두지 않는다 — 두면 이 단계가 공허해진다.
      - run: ./scripts/verify.sh
