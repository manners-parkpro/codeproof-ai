[project]
name = "codeproof-ai"
version = "0.1.0"
description = "AI 코드리뷰 품질 측정 실험 플랫폼 — 측정 방식이 결과를 얼마나 만드는지 측정한다"
readme = "README.md"
authors = [
    { name = "Colin", email = "111325124+colin-lulu@users.noreply.github.com" }
]
requires-python = ">=3.14"
dependencies = [
    "anthropic>=1.8.0",
    "openai>=3.19.0",
]

[project.scripts]
codeproof = "codeproof_ai.cli:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.8",
    "mypy>=2.3.1",
]

# ─────────────────────────────────────────────────────────────
# Ruff — 이 저장소는 자기 자신을 리뷰 대상으로 쓸 수 있어야 한다
# ─────────────────────────────────────────────────────────────
[tool.ruff]
line-length = 100
target-version = "py314"
src = ["src", "tests"]

# 🔴 코퍼스는 코드가 아니라 **표본**이다.
#    decoy 는 수상해 보이는 코드를 일부러 담은 물건이라, 린트를 만족시키려고
#    고치는 순간 표본이 파괴된다 (D005 twin 의 미사용 인자는 가드가 제거됐다는 증거다).
#    분석기는 --isolated 로 돌므로 이 설정의 영향을 받지 않는다.
#    corpus/xauthor 는 codex 가 쓴 쌍이다 (DESIGN §7.10d) - 코퍼스를 더하면 여기와 tests/corpora.py 에 같이 더한다.
extend-exclude = ["corpus/decoys", "corpus/xauthor", "results"]   # results 는 기록이다 - 린트에 맞추려 고치면 기록이 바뀐다

[tool.ruff.lint]
select = [
    "F", "E", "W",      # pyflakes · pycodestyle
    "I",                # isort
    "N",                # pep8-naming
    "UP",               # pyupgrade
    "B",                # bugbear
    "S",                # bandit
    "A",                # builtins shadowing
    "C4",               # comprehensions
    "PTH",              # pathlib
    "SIM",              # simplify
    "TC",               # type-checking blocks
    "ARG",              # unused arguments
    "PL",               # pylint
    "RUF",
]
ignore = [
    "PLR0913",  # 인자 수 — 도메인 값 객체는 필드가 많다
    "S101",     # assert — 테스트와 불변식 검사에 쓴다
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "PLR2004"]

[tool.ruff.lint.isort]
known-first-party = ["codeproof_ai"]

# ─────────────────────────────────────────────────────────────
# mypy — domain 은 특히 엄격하게. 여기가 무너지면 전부 무너진다
# ─────────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.14"
files = ["src", "tests"]   # corpus/decoys 는 표본이므로 제외 (ruff extend-exclude 참조)
strict = true
warn_unreachable = true
enable_error_code = ["redundant-expr", "truthy-bool", "ignore-without-code"]

[[tool.mypy.overrides]]
module = "codeproof_ai.domain.*"
disallow_any_explicit = false   # dict[str, object] 로 raw 페이로드를 받는다

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers --strict-config"
