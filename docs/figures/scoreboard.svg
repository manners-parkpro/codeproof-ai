<!-- 생성물 - `uv run codeproof report` 가 만든다. 손으로 고치지 않는다. -->
<svg xmlns="http://www.w3.org/2000/svg" width="760" height="366" viewBox="0 0 760 366" role="img" aria-label="Claude Code 와 Codex CLI — 같은 코드 150쌍을 리뷰했다">
<style>
text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
       "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; fill: #1f2328; font-size: 12px; }
.bg { fill: #ffffff; } .muted { fill: #59636e; } .title { font-size: 16px; font-weight: 600; }
.strong { font-weight: 600; } .grid { stroke: #d1d9e0; stroke-width: 1; }
.safe { fill: #0969da; } .inj { fill: #bc4c00; }
.claude { fill: #8250df; } .codex { fill: #1a7f37; }
.pc { fill: #1a7f37; } .pv { fill: #bf8700; } .pb { fill: #8c959f; } .pr { fill: #cf222e; }
.whisker { stroke: #59636e; stroke-width: 2; } .zero { stroke: #cf222e; stroke-dasharray: 4 3; }
.code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
text.guard { fill: #0969da; } text.bug { fill: #cf222e; } text.small { font-size: 11px; }
@media (prefers-color-scheme: dark) {
  text { fill: #e6edf3; } .bg { fill: #0d1117; } .muted { fill: #9198a1; }
  .grid { stroke: #3d444d; } .safe { fill: #4493f8; } .inj { fill: #f0883e; }
  .claude { fill: #ab7df8; } .codex { fill: #3fb950; }
  .pc { fill: #3fb950; } .pv { fill: #d29922; } .pb { fill: #656c76; } .pr { fill: #f85149; }
  .whisker { stroke: #9198a1; }
  text.muted { fill: #9198a1; } text.guard { fill: #4493f8; } text.bug { fill: #f85149; }
}
</style>
<rect class="bg" width="760" height="366" rx="8"/>
<text x="20" y="30" class="title" text-anchor="start">Claude Code 와 Codex CLI — 같은 코드 150쌍을 리뷰했다</text>
<text x="20" y="50" class="muted" text-anchor="start">짝마다 3회 리뷰 · 한 번 리뷰했을 때 기대할 수 있는 비율 · 채점: 증명된 범위 안의 결함 주장만 헛경고 (provable_safety)</text>
<text x="20" y="90" class="strong" text-anchor="start">버그를 짚었다</text>
<text x="20" y="108" class="muted small" text-anchor="start">버그 코드의 결함을 지적</text>
<rect class="claude" x="215" y="78" width="250.4" height="16" rx="2"/>
<text x="471.4" y="90" text-anchor="start">69.6%</text>
<rect class="codex" x="215" y="100" width="171.2" height="16" rx="2"/>
<text x="392.2" y="112" text-anchor="start">47.6%</text>
<text x="20" y="150" class="strong" text-anchor="start">버그를 놓쳤다</text>
<text x="20" y="168" class="muted small" text-anchor="start">결함을 지적하지 못함</text>
<rect class="claude" x="215" y="138" width="109.6" height="16" rx="2"/>
<text x="330.6" y="150" text-anchor="start">30.4%</text>
<rect class="codex" x="215" y="160" width="188.8" height="16" rx="2"/>
<text x="409.8" y="172" text-anchor="start">52.4%</text>
<text x="20" y="210" class="strong" text-anchor="start">안전한 코드에 헛경고</text>
<text x="20" y="228" class="muted small" text-anchor="start">안전하다고 증명한 범위를 결함이라 함</text>
<rect class="claude" x="215" y="198" width="25.6" height="16" rx="2"/>
<text x="246.6" y="210" text-anchor="start">7.1%</text>
<rect class="codex" x="215" y="220" width="7.2" height="16" rx="2"/>
<text x="228.2" y="232" text-anchor="start">2.0%</text>
<text x="20" y="270" class="strong" text-anchor="start">버그만 정확히 짚었다 (핵심)</text>
<text x="20" y="288" class="muted small" text-anchor="start">헛경고 없이 결함을 짚음</text>
<rect class="claude" x="215" y="258" width="232.8" height="16" rx="2"/>
<text x="453.8" y="270" text-anchor="start">64.7%</text>
<rect class="codex" x="215" y="280" width="168.8" height="16" rx="2"/>
<text x="389.8" y="292" text-anchor="start">46.9%</text>
<text x="740" y="270" class="strong" text-anchor="end">차이 +17.8%p</text>
<text x="740" y="286" class="muted small" text-anchor="end">95% 신뢰구간 [+11.1, +24.9]</text>
<text x="740" y="300" class="muted small" text-anchor="end">우연으로 보기 어렵다</text>
<rect class="claude" x="20" y="318" width="12" height="12" rx="2"/>
<text x="38" y="328" text-anchor="start">Claude Code · claude-fable-5-1</text>
<rect class="codex" x="300" y="318" width="12" height="12" rx="2"/>
<text x="318" y="328" text-anchor="start">Codex CLI · gpt-6-astra</text>
<text x="20" y="350" class="muted" text-anchor="start">결함 줄 근처(10줄)까지 지적을 인정해도 결론은 같다 · 추론 강도(effort) low · 같은 프롬프트 · 주석 속 힌트를 지운 코드</text>
</svg>
