decoy_id = "D060-early-return-covers-the-rest"
trap_kind = "unreachable_branch"

[bait]
apparent_defect = """
함수 마지막 줄이 0 으로 나눈다. 어떤 입력이 여기 닿으면 ZeroDivisionError 가
터지는 형태라 실수로 남은 코드나 방어가 빠진 기본 경로로 읽히고,
상수 0 나눗셈은 린터도 잡는 모양이다.
"""
lure_lines = [11, 12]

[safety]
claim = "1 / 0 은 실행될 수 없다"
justification = """
바로 위 두 줄이 amount 가 0 이상인 모든 경우를 0.0 으로 반환해 걷어내기
때문에 마지막 줄에 도달하려면 amount 가 음수여야 하는데, 이 함수의 인자는
금액이라 호출부 계약상 음수가 오지 않는다. 그래도 그 계약이 깨졌을 때
조용히 0.0 을 돌려주는 대신 즉시 터지도록 남겨 둔 표식이고, 도달하면
그것이 곧 상류 버그의 증거가 된다.
"""
guard_symbol = "discount"
guard_lines = [10, 12]

[twin]
defect = """
amount >= 0 을 0.0 으로 처리하는 분기가 사라진다.
100 미만의 정상 금액이 전부 마지막 줄에 도달해 ZeroDivisionError 가 난다.
"""
