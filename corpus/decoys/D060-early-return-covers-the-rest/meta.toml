decoy_id = "D060-early-return-covers-the-rest"
trap_kind = "unreachable_branch"

[bait]
apparent_defect = """
함수 마지막 줄이 0 으로 나눈다. 어떤 입력이 여기 닿으면 ZeroDivisionError 가
터지는 형태라 실수로 남은 코드나 방어가 빠진 기본 경로로 읽히고,
상수 0 나눗셈은 린터도 잡는 모양이다.
"""
lure_lines = [11, 12]

[safety]
claim = "1 / 0 은 실행될 수 없다"
justification = """
루프가 100 이상의 amount 를 모두 반환하고 바로 위 두 줄이 100 미만의 amount 를
모두 0.0 으로 반환하기 때문에 두 분기가 int 전체를 빈틈없이 나눈다. 그래서 음수를 포함한
어떤 int 도 마지막 줄에 도달하지 않는다. 마지막 줄은 그 나눔이 깨졌을 때 조용히 지나가지
않도록 남겨 둔 표식이다.
"""
guard_symbol = "discount"
guard_lines = [10, 12]

[twin]
defect = """
amount < 100 을 0.0 으로 처리하는 분기가 사라진다.
100 미만의 금액이 전부 마지막 줄에 도달해 ZeroDivisionError 가 난다.
"""
