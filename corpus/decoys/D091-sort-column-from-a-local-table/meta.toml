decoy_id = "D091-sort-column-from-a-local-table"
trap_kind = "constant_only_sink"

[bait]
apparent_defect = """
list_members 가 호출자가 준 sort 에 따라 SQL 문의 ORDER BY 자리를 f-string 으로 채워 실행한다. 정렬 열은
매개변수로 넘길 수 없는 자리라 값이 문장에 그대로 들어가는 것처럼 보여, sort 로 하위 질의나 다른 절을
끼워 넣는 SQL 주입으로 읽힌다.
"""
lure_lines = [12, 13]

[safety]
claim = "list_members 가 실행하는 문장의 ORDER BY 자리에는 같은 함수의 표에 적힌 세 값 중 하나만 들어간다"
justification = """
같은 함수가 sort 를 columns 의 키와 견주고 없으면 ValueError 로 끝내므로, 문장을 만드는 줄에 닿는 것은
키로 고른 columns 의 값뿐이다. 그 값은 이 함수 안에 적힌 상수 문자열 셋이라 호출자의 문자열은 키로만
쓰이고 문장에는 한 글자도 들어가지 않는다. LIMIT 도 모듈 상수다.
"""
guard_symbol = "list_members"
guard_lines = [9, 11]

[twin]
defect = """
키 확인이 없고 표에 없는 sort 는 그대로 ORDER BY 자리에 들어간다. "(SELECT ...)" 나 "name DESC" 같은 값으로
문장을 바꿀 수 있다.
"""
