decoy_id = "D077-purge-tables-come-from-fixed-groups"
trap_kind = "constant_only_sink"

[bait]
apparent_defect = """
_purge 가 table 인자를 f-string 으로 DELETE 문에 그대로 끼워 넣는다. 테이블 이름은 자리표시자로 넘길
수 없어 문자열로 이어 붙였고, 인자가 바깥에서 오면 임의의 테이블을 지우거나 문장을 바꾸는 SQL 주입으로
읽힌다.
"""
lure_lines = [12, 12]

[safety]
claim = "_purge 의 f-string 에 들어가는 table 은 _GROUPS 에 적힌 이름뿐이다"
justification = """
_purge 를 부르는 곳은 purge_expired 하나뿐이고, purge_expired 는 group 이 _GROUPS 의 키가 아니면
ValueError 로 끝내므로 tables 는 언제나 모듈에 박아 둔 튜플이다. 그래서 바깥 입력은 어느 묶음을
고를지만 정하고 문장에 들어가는 글자는 상수에서만 오며, 주입할 통로가 없다.
"""
guard_symbol = "purge_expired"
guard_lines = [18, 20]

[twin]
defect = """
purge_expired 가 group 을 쉼표로 쪼갠 값을 그대로 테이블 이름으로 쓴다. 바깥 입력이 DELETE 문에 닿아
정리 대상이 아닌 테이블도 지울 수 있다.
"""
