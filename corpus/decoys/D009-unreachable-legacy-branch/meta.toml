설령 도달한다 해도 두 멤버의 값 문자열은 각각 네 글자와 세 글자라 len 이 0 이
될 수 없다. 이 함수는 Plan 이 열거형이 되기 전의 잔재다.
"""
guard_symbol = "rate"
guard_lines = [16, 19]

[twin]
defect = """
PRO 분기가 사라져 마지막 return 이 실제로 도달한다. Plan.PRO 로 호출하면
_legacy_rate 가 실행되어 요금이 9.9 가 아니라 100/3 으로 잘못 계산된다.
"""
