decoy_id = "D009-unreachable-legacy-branch"
trap_kind = "unreachable_branch"

[bait]
apparent_defect = """
_legacy_rate 가 len(plan) 으로 나눈다. 빈 문자열이 들어오면 ZeroDivisionError 이고,
인자 타입이 str 이라 무엇이든 들어올 수 있어 보인다. rate 의 마지막 return 이
그 함수를 부르므로 0 나눗셈 경로가 살아 있는 것처럼 읽힌다.
"""
lure_lines = [11, 12]

[safety]
claim = "_legacy_rate 는 호출되지 않으며 ZeroDivisionError 도 날 수 없다"
justification = """
rate 의 인자는 Plan 이고 Plan 의 멤버는 FREE 와 PRO 둘뿐인데 앞의 두 분기가
