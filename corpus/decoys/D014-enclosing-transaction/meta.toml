decoy_id = "D014-enclosing-transaction"
trap_kind = "enclosing_context"

[bait]
apparent_defect = """
_move 가 출금과 입금을 두 구문으로 나눠 수행한다. 첫 줄이 성공하고 둘째 줄에서
KeyError 가 나면 돈이 사라지는 부분 갱신으로 읽힌다. 함수 안에 try 도 롤백도
없어서 원자성이 깨진 것처럼 보인다.
"""
lure_lines = [21, 23]

[safety]
claim = "_move 는 부분 갱신을 남길 수 없다"
justification = """
_move 의 유일한 호출부인 transfer 가 ledger.transaction() 컨텍스트 안에서
호출하기 때문에, _move 안에서 예외가 전파되면 컨텍스트 매니저의 except 절이
시작 시점 스냅샷으로 balances 를 되돌린다. 따라서 두 구문 사이에서 실패해도
외부에서 관측되는 상태는 이체 전이거나 이체 후이지 그 중간이 아니다.
_move 안에 롤백을 중복으로 두면 이중 복원이 된다.
"""
guard_symbol = "transaction"
guard_lines = [26, 28]

[twin]
defect = """
transfer 에서 with ledger.transaction() 이 사라져 _move 가 보호 없이 실행된다.
dst 계정이 없으면 출금만 반영된 채 KeyError 가 전파되어 잔액이 사라진다.
"""
