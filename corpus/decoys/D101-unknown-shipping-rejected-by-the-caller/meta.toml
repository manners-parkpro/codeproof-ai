justification = """
_fee 를 부르는 곳은 quote 하나이고, quote 는 부르기 전에 kind 가 _KINDS 의 두 이름 중 하나인지 견주고 아니면
ValueError 로 끝낸다. 그래서 _fee 에 닿는 kind 는 언제나 "express" 나 "standard" 와 같은 문자열이라 앞의 두
비교 중 하나가 참이고, 마지막 return 0 까지 내려가는 값이 없다. 무게도 같은 함수가 0 보다 크고 30 이하인지
먼저 보므로 두 분기의 배송비는 언제나 기본요금 이상이다.
"""
guard_symbol = "quote"
guard_lines = [18, 19]

[twin]
defect = """
quote 가 배송 방식을 확인하지 않는다. "Express" · "overnight" 같은 값이 _fee 의 마지막 분기로 빠져 배송비 0 원
견적이 나간다.
"""
