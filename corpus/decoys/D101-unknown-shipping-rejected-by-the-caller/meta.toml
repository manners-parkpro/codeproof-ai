decoy_id = "D101-unknown-shipping-rejected-by-the-caller"
trap_kind = "unreachable_branch"

[bait]
apparent_defect = """
_fee 가 express · standard 가 아닌 배송 방식에 0 을 돌려준다. 오타나 새 배송 방식 이름이 들어오면 배송비 없이
견적이 나가는 것처럼 보여, 알 수 없는 입력이 무료 배송으로 빠지는 기본 분기 결함으로 읽힌다.
