decoy_id = "D074-row-shape-checked-before-indexing"
trap_kind = "upstream_validation"

[bait]
apparent_defect = """
bytes_by_path 가 각 행을 공백으로 나눈 결과에서 parts[2] 와 parts[3] 을 길이 확인 없이 꺼내고 int 로
바꾼다. 필드가 모자란 행이면 IndexError, 바이트 칸이 숫자가 아니면 ValueError 로 집계 전체가
중단되는 입력 검증 누락으로 보인다.
"""
lure_lines = [14, 15]

[safety]
claim = "bytes_by_path 의 parts[2] 접근과 int(parts[3]) 는 IndexError 도 ValueError 도 낼 수 없다"
justification = """
bytes_by_path 가 인덱싱하는 parts 는 _validated 의 반환값이고, _validated 는 필드가 정확히 넷이 아니거나
넷째 필드가 isdecimal 을 통과하지 못하거나 18자리를 넘으면 그 자리에서 행을 거부하므로 돌아오는 목록은
언제나 길이 4 이다. isdecimal 은 isdigit 과 달리 위첨자 숫자를 거부해 int 가 받는 십진 숫자만 남기고,
18자리는 int 의 자릿수 상한을 가장 낮게 설정한 640 보다도 짧기 때문에 int 변환도 실패하지 않는다.
"""
guard_symbol = "_validated"
guard_lines = [6, 7]

[twin]
defect = """
_validated 가 행을 나누기만 하고 필드 수와 숫자 여부를 검사하지 않는다. 필드가 모자란 행은 parts[2] 나
parts[3] 에서 IndexError, 바이트 칸이 숫자가 아닌 행은 int 에서 ValueError 를 내 집계 전체가 중단된다.
"""
