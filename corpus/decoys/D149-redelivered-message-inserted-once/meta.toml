decoy_id = "D149-redelivered-message-inserted-once"
trap_kind = "idempotent_retry"

[bait]
apparent_defect = """
큐가 같은 메시지를 다시 배달하면 record 가 같은 message_id 로 다시 불리고, 그때마다 INSERT 가 줄을 하나씩 더하는 중복 기록
결함처럼 보인다. deliveries 에는 message_id 의 UNIQUE 제약도 PRIMARY KEY 도 없다.
"""
lure_lines = [21, 21]

[safety]
claim = "path 가 쓸 수 있는 디렉터리 안의 파일 경로이고(빈 문자열 · ':memory:' · 'file:' 로 시작하는 SQLite 특수 이름이 아니다) 그 데이터베이스 파일이 없거나 UTF-8 이며 그 안의 deliveries 표와 deliveries_message_id 를 record 로만 만들고 쓰는 한(다른 표는 있어도 된다 · 부르는 동안 다른 연결이 그 파일에 쓰기 잠금을 쥐는 경우는 말하지 않는다), UTF-8 로 쓸 수 있는 message_id · body 의 record(path, message_id, body) 는 예외 없이 끝나고 그 뒤로 deliveries 에는 그 message_id 의 줄이 처음 예외 없이 끝난 부름의 body 로 정확히 하나 있다 - 같은 message_id 로 몇 번을 다시 불러도, 그 사이에 다른 message_id 가 몇 개 끼어도 늘거나 바뀌지 않는다. 예외로 끝난 record 는 줄을 남기지 않는다. message_id 는 문자열이 같을 때만 같은 것으로 치고(정규화하지 않는다) body 는 같음을 정하지 않는다. UTF-8 이 아닌 데이터베이스 파일이면 아무것도 쓰지 않고 거절한다"
justification = """
_RECORD 는 INSERT ... SELECT 에 WHERE NOT EXISTS 를 붙여 같은 message_id 의 줄이 이미 있으면 아무것도 넣지 않으므로, 다시 불린
record 는 줄을 늘리지도 body 를 바꾸지도 않는다. 비교는 TEXT 칸에 대한 = 라 기본 BINARY 정렬로 글자가 모두 같을 때만 참이고
(대소문자 · 뒤 공백 · NUL 뒤까지 보고 정규화하지 않는다), 넣는 문장 하나가 with conn 의 트랜잭션 안에서 돌기 때문에 예외로 끝난
부름은 되돌려져 줄을 남기지 않는다. 글자를 바꿔 담을 수 있는 UTF-8 이 아닌 파일은 쓰기 전에 거절한다.
"""
guard_symbol = "_RECORD"
guard_lines = [8, 11]

[twin]
defect = """
_RECORD 가 조건 없는 INSERT ... VALUES 다. 다시 배달된 메시지마다 같은 message_id 의 줄이 하나씩 더 쌓여, 한 번 받은 메시지가
여러 번 받은 것으로 기록된다.
"""
