decoy_id = "D085-formula-neutralizer-beside-squeezer"
trap_kind = "noop_shim_neighbor"

[bait]
apparent_defect = """
export_rows 가 사용자가 넣은 칸 값을 CSV 로 그대로 내보낸다. = · + · - · @ 로 시작하는 값은
스프레드시트가 수식으로 실행하므로, 내려받은 파일을 연 사람에게 수식이 실행되는 CSV 주입(formula
injection)으로 읽힌다.
"""
lure_lines = [25, 25]

[safety]
claim = "export_rows 가 쓰는 칸은 순수한 숫자가 아닌 한 = · + · - · @ 로 시작하지 않는다"
justification = """
export_rows 는 칸마다 _squeeze 로 공백을 정리한 뒤 _neutralize 를 거쳐 쓰고, _neutralize 는 수식
시작 글자로 시작하면서 순수한 숫자가 아닌 값 앞에 작은따옴표를 붙인다. 공백 정리가 먼저라 앞쪽
공백이나 탭 뒤에 숨긴 = 도 맨 앞으로 나온 뒤에 걸러지고, 그래서 이 CSV 를 쉼표로 나눠 읽는 한
순수한 숫자 말고는 수식 시작 글자로 시작하는 칸이 없다. 옆의 _squeeze 는 공백만 다루므로 무력화를
대신하지 못한다. 읽는 쪽이 세미콜론 같은 다른 구분자로 줄을 다시 나눠 칸 중간의 = 가 새 칸의
맨 앞이 되는 경우는 이 주장 밖이다.
"""
guard_symbol = "_neutralize"
guard_lines = [11, 14]

[twin]
defect = """
export_rows 가 공백 정리 함수만 부르고 _neutralize 를 거치지 않는다. =HYPERLINK(...) 같은 칸이 그대로
수식으로 나간다.
"""
