decoy_id = "D069-retry-overwrites-the-same-key"
trap_kind = "idempotent_retry"

[bait]
apparent_defect = """
credit 가 시도마다 원장에 적립 행을 먼저 쓰고 나서 알림을 보낸다. 알림이 ConnectionError 로
실패하면 continue 로 처음부터 다시 돌아 같은 배달의 적립 행을 또 쓰므로, 재시도 횟수만큼 포인트가
중복 적립되는 비멱등 재시도로 보인다.
"""
lure_lines = [13, 17]

[safety]
claim = "credit 를 몇 번 재시도해도 한 delivery_id 의 적립 행은 원장에 하나뿐이다"
justification = """
시도마다 쓰는 자리가 _ledger[delivery_id] 라 키가 배달 번호 자체이고, 같은 키에 대입하면 dict 는
행을 늘리지 않고 앞의 값을 덮어쓰므로 실패한 시도가 남긴 행은 다음 시도의 행으로 바뀐다. 따라서
재시도가 몇 번 일어나도 그 배달의 행은 마지막 시도의 것 하나이고 포인트도 한 번만 남는다.
"""
guard_symbol = "credit"
guard_lines = [13, 13]

[twin]
defect = """
적립 행의 키를 원장 크기로 매번 새로 만든다. 알림이 실패한 시도마다 다른 키로 행이 남아 한 배달에
포인트가 재시도 횟수만큼 쌓인다.
"""
