decoy_id = "D089-tile-side-limited-by-enum"
trap_kind = "bounded_input"

[bait]
apparent_defect = """
blank_tile 이 호출자가 준 side 를 제곱한 만큼의 바이트열을 만든다. 크기를 제한하는 비교가 보이지 않아,
side 하나로 수십 GB 짜리 할당을 요청하게 만드는 무제한 할당(메모리 소진)으로 읽힌다.
"""
