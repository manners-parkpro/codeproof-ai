blank_tile 은 할당하기 전에 side 를 Side(side) 로 열거형 값에 맞추고, IntEnum 은 정의된 값(16 · 64)과
같지 않은 수를 ValueError 로 거절한다. 그래서 할당 줄에 닿는 size 는 언제나 16 이나 64 이고, 바이트열
크기의 상한이 입력과 무관하게 64 × 64 × 4 로 고정된다.
"""
guard_symbol = "Side"
guard_lines = [15, 15]

