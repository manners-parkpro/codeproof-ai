decoy_id = "D132-bucket-refilled-under-the-acquire-lock"
trap_kind = "caller_held_lock"

[bait]
apparent_defect = """
_refill 이 여러 스레드가 함께 쓰는 토큰 수와 기준 시각을 락 없이 읽고 고친다. 두 스레드가 동시에 채우면 같은 시간을 두 번 토큰으로
바꾸거나 한쪽의 갱신을 덮어써, 허용량보다 많은 요청을 통과시키는 경쟁 조건으로 읽힌다.
"""
lure_lines = [23, 28]

[safety]
claim = "clock 이 예외 없이 int 를 돌려주는 동안 여러 스레드가 동시에 try_acquire 를 불러도 각 호출은 예외 없이 True 나 False 를 돌려주고, 시계가 줄지 않는 동안 만든 때부터 시계가 t 만큼 갔다면 True 를 받은 호출은 모두 합쳐 capacity + t // interval_ns 번을 넘지 않는다. 그 동안 차례로 부르면 토큰이 있을 때만 하나를 꺼내 True 를, 없으면 False 를 돌려준다 - 토큰은 처음 capacity 개이고 마지막으로 쌓은 때부터 시계가 interval_ns 만큼 갈 때마다 하나씩 쌓이되 capacity 를 넘지 않으며, 가득 찬 동안 지난 시간은 나중 토큰으로 넘어가지 않는다. capacity 나 interval_ns 가 1 보다 작으면 만들 때 거절한다"
justification = """
_refill 은 try_acquire 에서만 불리고, try_acquire 는 채우기 · 토큰 확인 · 꺼내기를 모두 self._lock 을 쥔 채 하므로 두 스레드가 같은
시간을 함께 토큰으로 바꾸거나 같은 토큰을 함께 꺼내지 못한다. _refill 은 기준 시각부터 지난 interval_ns 의 정수 배만큼만 토큰을
더하고 기준 시각을 그만큼만 옮기므로, 쌓인 토큰은 모두 합쳐 (지금 - 만든 때) // interval_ns 를 넘지 않고 남은 시간 조각은 다음
채우기로 넘어간다. min 이 capacity 를 넘는 몫을 버리고 가득 차 있으면 기준 시각을 지금으로 옮기기 때문에, 가득 찬 동안의 시간은
조각까지 토큰이 되지 않는다. 그래서 통과한 호출은
처음 capacity 개와 쌓인 토큰을 넘지 못한다.
"""
guard_symbol = "try_acquire"
guard_lines = [31, 31]

[twin]
defect = """
try_acquire 가 락 없이 채우고 확인하고 꺼낸다. 토큰이 하나 남았을 때 두 스레드가 함께 확인을 통과해 둘 다 꺼내면 허용량보다 많은
요청이 통과하고 토큰 수가 음수가 된다.
"""
