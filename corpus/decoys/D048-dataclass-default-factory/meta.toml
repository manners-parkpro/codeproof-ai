decoy_id = "D048-dataclass-default-factory"
trap_kind = "frozen_after_init"

[bait]
apparent_defect = """
가변 리스트가 필드 기본값 자리에 있고 메서드가 그것을 제자리에서 변형한다.
파이썬에서 가변 기본값은 모든 인스턴스가 하나를 공유하는 고전적인 함정이라,
한 Job 에 태그를 달면 다른 Job 에도 보이는 상태 누출로 읽힌다.
"""
lure_lines = [9, 12]

[safety]
claim = "tags 는 인스턴스 사이에 공유될 수 없다"
justification = """
기본값이 리스트 객체 자체가 아니라 field(default_factory=list) 이고, dataclass 는
그 팩토리를 인스턴스를 만들 때마다 호출해 새 리스트를 배정하기 때문에 두 Job 이
같은 리스트를 가리키는 일이 일어나지 않는다. 그래서 append 가 다른 인스턴스에
보이지 않는다. 위험한 것은 팩토리를 쓰느냐가 아니라 그 팩토리가
매번 새 객체를 돌려주느냐이고, list 는 호출될 때마다 새 리스트를 만든다.
"""
guard_symbol = "Job"
guard_lines = [6, 9]

[twin]
defect = """
default_factory 가 새 리스트 대신 모듈 전역 _SHARED 를 돌려준다.
팩토리는 매번 불리지만 같은 객체를 주므로 모든 Job 이 리스트를 공유하고,
한쪽 태그가 다른 쪽에 나타난다.
"""
