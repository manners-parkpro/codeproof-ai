decoy_id = "D143-raw-render-branch-never-chosen"
trap_kind = "unreachable_branch"

[bait]
apparent_defect = """
_render 의 escape 가 거짓인 분기가 항목을 이스케이프하지 않고 <li> 에 그대로 잇는다. 항목에 <script> 나 다른 태그가 들어 있으면
그대로 페이지에 들어가는 XSS 결함으로 보인다.
"""
lure_lines = [7, 8]

[safety]
claim = "page 는 어떤 items 든 html.parser 로 읽으면 ul 요소 하나 안에 items 의 차례대로 li 요소가 하나씩 있고 각 li 의 글은 그 항목 그대로인 조각을 돌려준다 - 그 밖의 요소 · 속성 · 글(li 사이나 ul 안쪽의 공백 포함)은 만들지 않는다 (_render 의 날것 분기는 page 에서 닿지 않는다)"
justification = """
_render 를 부르는 곳은 page 하나이고, page 는 키워드 인자 escape=True 를 상수로 넘긴다. escape 는 키워드 전용 인자라 위치로 잘못
넘길 길도 없으므로 if not escape 분기는 page 에서 닿지 않고, 실제로 도는 것은 항목마다 html.escape 를 거쳐 & · < · > · 따옴표를
문자 참조로 바꾼 뒤 <li> 에 잇는 분기다. 그래서 항목 안에는 태그나 참조를 시작하는 글자가 날것으로 남지 않고, 파서는 참조를
되돌려 항목을 그대로 읽는다.
"""
guard_symbol = "page"
guard_lines = [13, 13]

[twin]
defect = """
page 가 escape=False 로 불러 날것 분기를 탄다. 항목 "<img src=x onerror=…>" 가 그대로 태그가 된다.
"""
