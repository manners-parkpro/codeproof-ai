decoy_id = "D139-page-rows-collected-before-summing"
trap_kind = "idempotent_retry"

[bait]
apparent_defect = """
total 이 쪽을 받다가 TimeoutError 가 나면 같은 쪽을 다시 받는다. 시간 초과는 행 일부를 이미 내준 뒤에도 날 수 있으므로, 다시 받은
쪽의 앞부분 행을 두 번 더해 합계가 부풀려지는 중복 집계 결함처럼 보인다.
"""
lure_lines = [11, 17]

[safety]
claim = "total 은 0 부터 pages - 1 까지의 쪽을 차례로 보며 쪽마다 fetch(page) 를 많아야 3번 부르고, 다시 부르는 것은 fetch 가 그 쪽의 행을 끝까지 내주기 전에 - 부르는 순간이든 행을 내주는 도중이든 - TimeoutError(하위 클래스 포함)를 냈을 때뿐이며 그 시도에서 받은 행은 세지 않는다. 3번 모두 그러면 마지막 TimeoutError 를 받은 객체 그대로 올린다. TimeoutError 가 아닌 예외는 다시 부르지 않고 그대로 올린다. 그래서 돌려주는 합은 쪽마다 처음으로 끝까지 받은 한 번의 행의 합(행은 bool · IntEnum 같은 int 하위 타입도 그 값으로 센다)을 모두 더한 것이다"
justification = """
시도마다 rows = list(fetch(page)) 가 try 안에서 쪽의 행을 끝까지 모으고, amount 에 더하는 줄은 try 밖 - 모으기가 끝난 뒤 - 에 있으므로
행을 내주는 도중에 TimeoutError 가 나면 list 가 만들던 목록은 버려지고 amount 는 그 시도의 행을 하나도 더하지 않은 채
다음 시도로 넘어간다. except 는 TimeoutError 만 잡아 다른 예외는 그대로 올라가고, 마지막 시도의 TimeoutError 는 맨 raise 로 같은
객체가 다시 올라간다. 성공한 시도 뒤의 break 가 그 쪽의 재시도를 끝낸다.
"""
guard_symbol = "total"
guard_lines = [13, 13]

[twin]
defect = """
행을 받는 대로 amount 에 더한다. 쪽을 내주는 도중 시간 초과가 나면 이미 더한 앞부분 행을 다음 시도에서 또 더해 합계가 부풀려진다.
"""
