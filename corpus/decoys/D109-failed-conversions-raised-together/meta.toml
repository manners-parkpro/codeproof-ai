decoy_id = "D109-failed-conversions-raised-together"
trap_kind = "exception_absorbed"

[bait]
apparent_defect = """
_convert_one 이 convert 가 던진 Exception 을 모두 잡아 값으로 돌려준다. 변환 실패가 예외로 올라가지 않으니 깨진
파일이 있어도 일괄 변환이 성공한 것처럼 끝나는, 예외를 삼키는 결함으로 읽힌다.
"""
lure_lines = [9, 10]

[safety]
claim = "convert_all 은 convert 가 Exception 으로 실패한 파일이 있어도 나머지를 모두 시도하고, 그런 실패가 있으면 그 예외 객체를 모두 담은 ExceptionGroup 으로 끝난다"
justification = """
_convert_one 은 Exception 을 버리는 것이 아니라 값으로 돌려주고, 그 함수를 부르는 곳은 convert_all 하나다.
convert_all 은 None 이 아닌 반환을 모두 failures 에 모으고 반복이 끝난 뒤 failures 가 비어 있지 않으면 ExceptionGroup
으로 올리므로, 한 파일의 실패가 반복을 멈추지 않으면서 어떤 실패도 조용히 사라지지 않는다. 그룹의 exceptions 에는
convert 가 던진 바로 그 예외 객체가 트레이스백과 함께 들어 있다. 실패가 없을 때만 convert_all 은 그냥 돌아온다.
BaseException(KeyboardInterrupt · SystemExit 등)은 _convert_one 이 잡지 않으므로 배치를 그 자리에서 끝내고, paths 를 도는
중의 예외도 그렇다 - 둘 다 조용히 성공한 것처럼 끝나지 않으며 주장 밖이다.
"""
guard_symbol = "convert_all"
guard_lines = [18, 21]

[twin]
defect = """
convert_all 이 모은 실패를 올리지 않는다. 깨진 파일이 있어도 일괄 변환이 조용히 성공한 것처럼 끝나 실패가 사라진다.
"""
