decoy_id = "D080-failed-batch-restored-by-its-context"
trap_kind = "enclosing_context"

[bait]
apparent_defect = """
apply 가 갱신 항목을 하나씩 검사하며 바로 _config 에 쓴다. 뒤쪽 항목이 허용되지 않아 ValueError 가
나면 앞쪽 항목은 이미 반영된 뒤라, 설정이 절반만 바뀐 채 남는 부분 갱신(원자성 없음)으로 읽힌다.
"""
lure_lines = [25, 28]

[safety]
claim = "apply 가 갱신 도중 올라온 예외로 끝나면 _config 는 apply 를 부르기 전과 같다"
justification = """
apply 의 갱신은 전부 _restored_on_error 문맥 안에서 일어나고, 그 문맥은 들어갈 때 _config 를
before 에 복사해 두었다가 안에서 어떤 예외(BaseException 포함)가 올라와도 except 에서 _config 를
before 로 덮어쓴 뒤 다시 던진다. apply 는 _ALLOWED 의 키만 쓰고 그 키는 처음부터 _config 에 있으므로
before 로 덮어쓰면 앞서 쓴 항목까지 그대로 돌아가고, 덮어쓰기가 C 호출 하나라 그 사이에 반쯤 바뀐
설정이 보이지 않는다. 문맥이 락도 쥐므로 되돌리는 사이에 다른 반영이 끼어들지 않는다. 시그널
처리기가 되돌리기 바깥에서 던지는 비동기 예외는 이 주장 밖이다.
"""
guard_symbol = "_restored_on_error"
guard_lines = [18, 20]

[twin]
defect = """
_restored_on_error 가 before 를 복사만 하고 되돌리지 않는다. 중간 항목에서 실패하면 앞 항목만 반영된
설정이 남는다.
"""
