decoy_id = "D146-byte-range-end-is-inclusive"
trap_kind = "contract_half_open"

[bait]
apparent_defect = """
respond 가 Range 헤더의 범위를 body[start:stop] 으로 자른다. RFC 9110 의 bytes=a-b 는 끝 b 를 포함하는데 파이썬 조각은 stop 을
빼므로, 요청한 범위의 마지막 바이트를 잃는 off-by-one 처럼 보인다.
"""
lure_lines = [20, 20]

[safety]
claim = "respond 는 header 가 'bytes=a-b' 꼴(단위 bytes 는 ASCII 대소문자만 가리지 않고, a · b 는 1~18자리 ASCII 숫자)이고 a ≤ b 이며 a 가 body 의 길이보다 작으면 RFC 9110 대로 a 번째부터 b 번째까지 - 둘 다 포함, b 가 끝을 넘으면 끝까지 - 의 바이트를 돌려주고, 그 밖의 header(다른 꼴 · 여러 범위 · 앞뒤 글자 · 19자리 이상의 수)는 거절한다"
justification = """
respond 가 자르는 [start, stop) 은 _byte_range 가 돌려준 것이고, _byte_range 는 RFC 의 끝 포함 범위 [a, b] 를 끝에 1 을 더한 반열린
구간 [a, b + 1) 로 바꿔 준다 - b 가 끝을 넘으면 마지막 첨자 size - 1 로 줄인 뒤 1 을 더한다. 그래서 body[start:stop] 은 a 번째부터
b 번째(또는 마지막) 바이트까지를 빠짐없이 담는다. fullmatch 와 [0-9]{1,18} 이 다른 꼴 · 여러 범위 · 앞뒤 글자 · ASCII 가 아닌 숫자 ·
19자리 이상을 걸러 정수 변환 한도에 닿지 않고, a > b 이거나 a 가 길이 이상이면 거절하므로 빈 범위를 돌려주는 일도 없다.
"""
guard_symbol = "_byte_range"
guard_lines = [15, 15]

[twin]
defect = """
_byte_range 가 끝 포함 범위를 반열린 구간으로 바꿀 때 1 을 더하지 않는다. bytes=0-499 에 499 바이트만 돌려주고, bytes=7-7 에는 빈 값을
돌려준다.
"""
