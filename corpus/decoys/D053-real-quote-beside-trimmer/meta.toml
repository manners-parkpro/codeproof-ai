decoy_id = "D053-real-quote-beside-trimmer"
trap_kind = "noop_shim_neighbor"

[bait]
apparent_defect = """
사용자 인자를 공백으로 이어 붙여 셸 명령 문자열을 만든다. 문자열 조립으로
명령을 만드는 형태라 세미콜론이나 백틱이 섞이면 명령이 추가 실행되는
셸 인젝션 경로로 읽히고, 바로 위에 쓰이지 않는 것처럼 보이는 함수도 있다.
"""
lure_lines = [16, 17]

[safety]
claim = "build 가 만든 문자열을 POSIX sh 가 읽으면 binary 와 args 의 원소가 각각 글자 그대로 한 낱말이 된다 - 셸 메타문자 · 변수 대입 · = 확장이 살아남지 않는다 (cmd.exe · fish 처럼 POSIX 가 아닌 셸은 이 주장이 말하지 않는다)"
justification = """
build 가 binary 와 args 의 원소를 모두 넘기는 것은 이름만 그럴듯한 trim_arg 가 아니라 quote_arg 이고,
그 함수는 shlex.quote 로 내부의 작은따옴표를 탈출시키고, shlex.quote 가 감싸지 않고 둔 값(안전한
글자만으로 된 값)도 작은따옴표로 감싸기 때문에 모든 낱말이 작은따옴표 안에 있다. 그래서 세미콜론 ·
백틱 · 파이프가 전부 리터럴 문자가 되고, 이름=값 꼴의 첫 낱말이 변수 대입으로 읽히거나 = 로 시작하는
낱말이 zsh 에서 명령 경로로 바뀌지도 않는다. 공백만 떼어내는 trim_arg 는 그 문자들을 그대로 두므로 방어가 되지 않는다.
"""
guard_symbol = "quote_arg"
guard_lines = [11, 17]

[twin]
defect = """
build 가 quote_arg 대신 trim_arg 를 부른다.
공백 제거는 메타문자를 막지 못해 "; rm -rf /" 같은 인자가 그대로 나간다.
"""
