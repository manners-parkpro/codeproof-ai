decoy_id = "D052-tempdir-cleans-on-exit"
trap_kind = "enclosing_context"

[bait]
apparent_defect = """
_spill 이 디스크에 파일을 쓰고 경로만 돌려준다. 만든 파일을 지우는 코드가
함수 안에 전혀 없어서 호출할 때마다 임시 파일이 쌓이는 디스크 누수로 읽히고,
예외가 나면 더더욱 남을 것처럼 보인다.
"""
lure_lines = [7, 10]

[safety]
claim = "_spill 이 만든 파일은 남을 수 없다"
justification = """
_spill 은 디렉터리를 만들지 않고 인자로 받기만 하므로 소유권이 없고, 유일한
호출부인 export 가 TemporaryDirectory 블록 안에서 넘기기 때문에 블록을 벗어나는
모든 경로에서 디렉터리가 통째로 지워진다. 그 안에 무엇이 몇 개 있든 함께
사라지고, 예외가 전파되는 경우에도 __exit__ 가 실행되므로 마찬가지다.
_spill 이 자기가 쓴 파일을 지우면 호출자가 읽기도 전에 사라진다.
"""
guard_symbol = "export"
guard_lines = [13, 15]

[twin]
defect = """
TemporaryDirectory 블록이 mkdtemp 호출로 바뀌어 디렉터리가 정리되지 않는다.
호출할 때마다 임시 디렉터리와 그 안의 파일이 디스크에 그대로 남는다.
"""
