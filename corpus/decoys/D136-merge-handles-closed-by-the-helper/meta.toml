decoy_id = "D136-merge-handles-closed-by-the-helper"
trap_kind = "enclosing_context"

[bait]
apparent_defect = """
merge 가 경로마다 open 으로 파일을 열어 목록에 담기만 하고 with 로 감싸지도 닫지도 않는다. 열다 · 읽다 · 쓰다 실패하면 앞서 연
파일들이 열린 채 남는 파일 핸들 누수 결함으로 보인다.
"""
lure_lines = [28, 28]

[safety]
claim = "merge 가 돌아오거나 동기 예외로 끝나면 - 파일을 여는 도중 · 읽는 도중 · out 에 쓰는 도중의 실패이든 - merge 가 연 파일은 모두 코드가 닫았고(가비지 수집이 닫는 것이 아니다) 그 예외는 삼키지 않고 올라간다. 파일을 모두 열고 UTF-8 로 읽고 out 에 쓸 수 있으며 out 이 paths 의 파일에 쓰지 않고 각 파일의 줄(텍스트 모드로 읽고 \\n 으로 끝나지 않는 마지막 줄에는 \\n 을 붙인 것)이 정렬돼 있으면, merge 는 돌아오고 out 에는 paths 의 항목마다(같은 경로가 두 번 나오면 두 번) 그 파일의 그 줄들을 모아 정렬된 차례로 쓴다"
justification = """
merge 는 연 파일을 모두 _all_closed 가 내준 목록에 넣고, 여는 일부터 쓰는 일까지를 그 with 블록 안에서 한다. _all_closed 는 yield 를
try 안에 두므로 블록이 정상으로 끝나든 예외로 끝나든 finally 가 돌고, finally 는 목록의 핸들마다 close 를 ExitStack 의 콜백으로 걸어
하나의 close 가 실패해도 나머지를 닫는다. 그래서 열다가 실패하면 그때까지 연 파일이, 읽거나 쓰다가 실패하면 연 파일 전부가 블록을
나가기 전에 닫힌다. _lines 가 \\n 없는 마지막 줄에 \\n 을 붙인 줄을 내고 heapq.merge 가 그 줄들을 정렬된 차례로 합치므로, 차례는
\\n 을 붙인 뒤의 줄로 정해진다.
"""
guard_symbol = "_all_closed"
guard_lines = [12, 17]

[twin]
defect = """
연 파일을 목록에 담기만 하고 닫는 문맥이 없다. 열다 · 읽다 · 쓰다 실패하면 앞서 연 파일이 예외가 쥔 프레임과 함께 열린 채 남고,
성공해도 코드가 닫지 않아 가비지 수집이 닫는다 (ResourceWarning).
"""
