decoy_id = "D050-negative-slice-contract"
trap_kind = "contract_half_open"

[bait]
apparent_defect = """
길이 확인 없이 음수 인덱스로 슬라이스한다. 항목이 _KEEP 보다 적을 때 음수
시작점이 범위를 벗어나는 것처럼 보이고, 빈 리스트에서는 더더욱 IndexError 가
날 것처럼 읽힌다. 경계 처리가 어디에도 없다.
"""
lure_lines = [6, 8]

[safety]
claim = "items[-_KEEP:] 는 길이와 무관하게 안전하며 계약과 일치한다"
justification = """
파이썬 슬라이스는 인덱스가 범위를 벗어나도 예외를 내지 않고 실제 범위로 잘라
주기 때문에, 항목이 _KEEP 보다 적으면 자동으로 전체가 나오고 비어 있으면 빈
리스트가 나온다. 그리고 독스트링이 선언한 계약이 정확히 그것이다 - "적으면
전부". 길이를 재서 시작점을 계산하는 쪽이 오히려 위험한데, 길이가 _KEEP 보다
작으면 그 값이 음수가 되어 뒤에서 세는 의미로 뒤바뀌기 때문이다.
"""
guard_symbol = "recent"
guard_lines = [6, 8]

[twin]
defect = """
시작점을 len(items) - _KEEP 로 직접 계산한다. 항목이 _KEEP 보다 적으면 그 값이
음수가 되고 파이썬이 그것을 "뒤에서 n번째"로 해석해, 전부 돌려줘야 할 자리에서
일부만 돌려준다. 항목 3개면 마지막 2개만, 4개면 마지막 1개만 나온다.
"""
