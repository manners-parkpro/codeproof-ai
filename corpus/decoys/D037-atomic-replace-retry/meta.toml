decoy_id = "D037-atomic-replace-retry"
trap_kind = "idempotent_retry"

[bait]
apparent_defect = """
save 가 OSError 를 잡으면 같은 쓰기를 처음부터 다시 하는 재시도 루프다. 실패한 시도가 남긴
내용 위에 같은 내용을 또 쓰는 형태라 파일에 내용이 여러 번 쌓이는 중복 기록으로 읽힌다.
"""
lure_lines = [19, 27]

[safety]
claim = "반복 호출이 파일 내용을 늘릴 수 없다"
justification = """
_write 는 대상 파일에 이어 쓰지 않고 같은 디렉터리에 무작위 이름으로 새로 만든 임시 파일에
전체 내용을 쓴 뒤 replace 로 대상 자리에 통째로 옮기기 때문에 (임시 이름은 대상이나 이미 있는
다른 파일과 겹치지 않고, 쓰다 실패하면 임시 파일은 지워지며, 바꿔 넣기 전에 기존 파일의 권한을 옮긴다),
몇 번을 반복하든 대상 파일의 내용은
마지막 한 번의 결과와 같다. replace 는 같은 파일시스템에서 원자적이라 중간 상태가
관측되지도 않는다. 따라서 save 안의 재시도든 save 를 여러 번 부르는 것이든 이 반복은 멱등이고, 부분 기록도 누적도 일어나지 않는다.
"""
guard_symbol = "_write"
guard_lines = [10, 16]

[twin]
defect = """
_write 가 append 모드로 대상 파일에 직접 이어 쓴다.
save 를 다시 부르거나 쓰다 실패해 다시 시도하면 같은 내용이 그만큼 쌓여 파일이 망가진다.
"""
