decoy_id = "D038-broken-cache-is-removed"
trap_kind = "exception_absorbed"

[bait]
apparent_defect = """
JSONDecodeError 를 잡아서 빈 딕셔너리로 바꾼다. 로그도 남기지 않고 재전파도
하지 않는 형태라 데이터 손상을 조용히 감추는 예외 삼킴으로 읽히고, 호출자는
캐시가 깨졌다는 사실을 영영 알 수 없는 것처럼 보인다.
"""
lure_lines = [14, 16]

[safety]
claim = "캐시 파일을 읽기로 열 수 있고 지울 수 있으면 이 삼킴은 손상 상태를 남기지 않는다 - JSON 으로 읽을 수 없는 파일(문법 · UTF-8 · 정수 자릿수 한도 · 중첩 깊이)이든 값이 모두 str 인 객체가 아닌 JSON 이든 load_cache 는 그 파일을 지우고 빈 dict 를 돌려준다 (파일을 열거나 읽다가 나는 OSError - 읽기 권한이 없는 파일 등 - 는 이 주장이 말하지 않는다)"
justification = """
except 가 JSON 으로 읽지 못한 모든 경우(문법 · UTF-8 해독 · 정수 자릿수 한도는 ValueError, 중첩 깊이는
RecursionError)와 바로 위에서 올린 「str 값의 객체가 아님」을 함께 잡고, 잡은 자리에서 곧바로 unlink 로
깨진 파일을 제거하기 때문에 같은 손상이 다음 호출에서 반복되지 않고, 반환하는 빈 딕셔너리는 8-9행의 "파일 없음" 경로와
정확히 같은 값이라 호출자에게는 캐시 미스로 보인다. 캐시는 재계산 가능한 사본이
므로 미스와 손상을 구분할 필요가 없고, 여기서 예외를 올리면 복구 가능한 캐시
문제가 요청 실패로 승격된다. 파일을 지울 수 없으면(읽기 전용 디렉터리 · 남의 파일) unlink 의
OSError 가 그대로 올라가므로 손상이 조용히 남지도 않는다.
"""
guard_symbol = "load_cache"
guard_lines = [12, 16]

[twin]
defect = """
unlink 가 사라져 깨진 파일이 그대로 남는다.
호출할 때마다 같은 손상을 다시 만나 파싱에 실패하고, 캐시는 영구히 무력화된
채 아무도 그 사실을 알지 못한다.
"""
