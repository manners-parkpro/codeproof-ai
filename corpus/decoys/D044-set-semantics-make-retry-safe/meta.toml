decoy_id = "D044-set-semantics-make-retry-safe"
trap_kind = "idempotent_retry"

[bait]
apparent_defect = """
등록 전에 이미 구독 중인지 확인하지 않고 곧바로 추가한다. 존재 검사 없이
쓰기부터 하는 형태라 클라이언트가 같은 요청을 재시도하면 중복 구독이 쌓이고
알림이 여러 번 나가는 중복 등록으로 읽힌다.
"""
lure_lines = [7, 9]

[safety]
claim = "같은 구독을 여러 번 등록해도 중복이 생길 수 없다"
justification = """
members 가 담기는 자료구조는 리스트가 아니라 set 이고, set.add 는 이미 있는
원소에 대해 아무것도 하지 않는 멱등 연산이기 때문에 같은 user 로 몇 번을
호출하든 원소 수가 늘지 않는다. 따라서 반환되는 구독자 수도 변하지 않는다.
앞에 존재 검사를 두면 set 이 이미 보장하는 것을 한 번 더 확인하는 셈이고,
검사와 추가 사이에 경쟁 구간만 새로 만든다.
"""
guard_symbol = "_subscribers"
guard_lines = [3, 8]

[twin]
defect = """
자료구조가 list 로 바뀌어 append 가 멱등성을 잃는다.
같은 요청을 재시도하면 같은 사용자가 여러 번 쌓이고 알림이 중복 발송된다.
"""
