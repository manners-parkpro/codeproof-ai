decoy_id = "D054-fresh-list-per-call"
trap_kind = "defensive_copy"

[bait]
apparent_defect = """
_collect 가 인자로 받은 리스트에 계속 append 하고 그것을 그대로 돌려준다.
누적 대상을 밖에서 받아 제자리 변형하는 형태라, 같은 리스트가 재사용되면
호출 결과가 앞선 호출의 내용까지 안고 나오는 상태 누출로 읽힌다.
"""
lure_lines = [4, 7]

[safety]
claim = "normalize 의 결과에 이전 호출의 내용이 섞일 수 없다"
justification = """
_collect 는 비공개 함수이고 이 모듈에서 부르는 곳은 normalize 한 곳뿐인데,
normalize 가 호출할 때마다 새 리터럴 리스트를 만들어 넘기기 때문에 _collect 가
누적하는 대상은 매번 갓 만들어진 빈 리스트다. 따라서 호출 사이에 공유되는
상태가 존재하지 않는다. 안쪽에서 sink 를 복사하면 호출자가 넘긴 버퍼에
누적해 달라는 요청을 들어줄 수 없게 된다.
"""
guard_symbol = "normalize"
guard_lines = [10, 11]

[twin]
defect = """
normalize 가 새 리스트 대신 모듈 전역 _buffer 를 넘긴다.
두 번째 호출부터 앞선 호출의 결과가 그대로 남아 함께 반환된다.
"""
