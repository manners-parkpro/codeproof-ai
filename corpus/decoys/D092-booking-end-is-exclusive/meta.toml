decoy_id = "D092-booking-end-is-exclusive"
trap_kind = "contract_half_open"

[bait]
apparent_defect = """
_overlaps 가 두 예약을 엄격한 부등호(<)로만 비교한다. 한쪽의 끝과 다른 쪽의 시작이 같은 경계를 겹침으로
세지 않는 것처럼 보여, 경계에서 맞물린 예약을 이중으로 받는 off-by-one(<= 여야 한다)으로 읽힌다.
"""
lure_lines = [18, 18]

[safety]
claim = "accept 를 차례로 부르면 한 분이라도 겹치는 예약은 받지 않고, 앞 예약이 끝나는 분에 시작하는 예약은 받는다"
justification = """
_end 가 start + minutes 를 돌려주므로 끝은 예약에 들지 않는 첫 분이고, 한 예약이 차지하는 분은 반열린
구간 [start, start + minutes) 다. 그런 두 구간은 「a 의 시작 < b 의 끝」과 「b 의 시작 < a 의 끝」이 둘 다
참일 때만 공통인 분을 가지므로 엄격한 부등호가 정확한 겹침 조건이고, 끝과 시작이 같은 두 예약은 공통인
분이 없어 둘 다 받아도 된다. 길이가 0 이하인 예약은 어느 분도 차지하지 않으므로 _overlaps 는 그런 예약을 무엇과도
겹치지 않는다고 본다 - taken 에 그런 예약이 들어 있어도 새 예약을 막지 않는다.
"""
guard_symbol = "_end"
guard_lines = [11, 12]

[twin]
defect = """
_end 가 마지막 분(start + minutes - 1)을 돌려주는데 비교는 그대로 엄격한 부등호다. 앞 예약의 마지막 분에
시작하는 예약을 받아 그 분이 이중으로 예약된다.
"""
