decoy_id = "D130-zip-entries-resolved-inside-dest"
trap_kind = "upstream_validation"

[bait]
apparent_defect = """
extract 가 zip 항목 이름으로 만든 경로의 파일을 지우고 그 자리에 그대로 쓴다. 이름에 ../ 나 절대 경로가 든 악성 zip 이면 대상 폴더
밖의 파일을 지우거나 만들거나 덮어쓰는 zip slip(CWE-22) 결함처럼 보인다.
"""
lure_lines = [22, 23]

[safety]
claim = "dest 가 이미 있는 디렉터리면, extract 는 dest 밖에 파일이나 디렉터리를 하나도 만들거나 지우지 않고 밖의 파일 내용을 바꾸지 않는다 - 항목 이름이 .. 이나 절대 경로를 담거나, dest 안의 심볼릭 링크가 밖을 가리키거나, dest 안의 파일이 밖의 파일과 하드 링크로 이어져 있어도 그렇다 (dest 가 심볼릭 링크면 그것이 가리키는 디렉터리가 dest 다)"
justification = """
extract 는 dest 를 먼저 resolve 해 심볼릭 링크를 걷어낸 실제 경로 root 를 얻고, 항목마다 root 와 항목 이름을 이은 경로를 다시 resolve
하기 때문에 이름 속의 .. 은 접히고 절대 경로 이름은 root 를 버린 경로가 되며 dest 안의 심볼릭 링크는 마지막 성분이든 끊긴 링크든
가리키는 곳으로 풀린다. 그렇게 얻은 실제 경로가 root 안이 아니면 is_relative_to 가 거짓이라 mkdir · unlink · write_bytes 전에
ValueError 로 멈추므로 밖으로 풀리는 항목은 밖에 디렉터리도 파일도 만들지 않고 밖의 것을 지우지도 않는다. 디렉터리 항목은 members
에서 걸러 아예 만들지 않는다. 안으로 풀리는 항목은 내용을 먼저 다 읽고(읽을 수 없는 항목이면 기존 파일을 건드리지 않고 멈춘다) 그
자리의 기존 파일을 unlink 로 끊은 뒤 새 파일로 쓰기 때문에, 그 파일이 밖의 파일과 하드 링크로 이어져 있어도 밖의 파일 내용은
그대로이고(링크 수는 하나 준다) FIFO 같은 특수 파일을 거쳐 쓰지도 않는다. dest 가 없으면 mkdir 이 dest 와 그 위의 디렉터리를 만들
수 있어 주장은 dest 가 이미 있을 때만 말한다. extract 는 일반 파일과 디렉터리만 만들고 심볼릭 링크를 만들지 않으므로 앞 항목이
뒤 항목의 경로를 밖으로 돌릴 수도 없다. 밖으로 풀리는 항목에서 멈추면 그 전에 쓴 안쪽 파일은 남는다 - 안쪽 항목을 모두 풀어
주는지는 주장하지 않는다. dest 를 다른 프로세스나 스레드가 함께 바꾸는 경우는 주장 밖이다.
"""
guard_symbol = "extract"
guard_lines = [17, 19]

[twin]
defect = """
항목 경로를 resolve 만 하고 dest 안인지 확인하지 않는다. ../escape.txt 나 절대 경로 이름, dest 안에서 밖을 가리키는 심볼릭 링크를
지나는 이름이 dest 밖에 파일 · 디렉터리를 만들거나 밖의 기존 파일을 지우고 덮어쓴다 (zip slip).
"""
