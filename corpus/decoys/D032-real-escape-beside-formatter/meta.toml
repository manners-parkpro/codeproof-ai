decoy_id = "D032-real-escape-beside-formatter"
trap_kind = "noop_shim_neighbor"

[bait]
apparent_defect = """
row 가 사용자 값을 그대로 이어 붙여 CSV 한 줄을 만든다. 바로 위에 quote_cell
이라는 이름의 함수가 있는데 쓰지 않는 것처럼 보이고, 스프레드시트에서 = 로
시작하는 셀은 수식으로 실행되므로 CSV 수식 주입 경로로 읽힌다.
"""
lure_lines = [19, 20]

[safety]
claim = "row 가 만든 줄을 쉼표로 칸을 나누는 CSV 로 읽으면 어느 칸도 스프레드시트에서 수식으로 실행될 수 없다 - 세미콜론 · 탭으로 칸을 나누는 로캘이나 가져오기 설정, 칸 앞의 공백을 지우고 읽는 설정(csv 의 skipinitialspace · 공백 다듬기)은 이 주장이 말하지 않는다 (D085 와 같다)"
justification = """
row 가 부르는 것은 이름만 그럴듯한 quote_cell 이 아니라 neutralize_cell 이고,
그 함수가 _DANGEROUS 로 시작하는 값 앞에 작은따옴표를 붙이기 때문에 스프레드시트가
그 셀을 수식이 아니라 문자열로 읽는다. 값에 쉼표 · 큰따옴표 · 줄바꿈이 있으면 큰따옴표로 감싸고
안의 큰따옴표를 겹쳐 쓰므로, 값이 쉼표나 줄바꿈으로 새 셀이나 새 줄을 만들어 중화되지 않은 칸을
끼워 넣지도 못한다. 따옴표로 감싸기만 하는 quote_cell 은
= 로 시작하는 내용을 그대로 두므로 방어가 되지 않는다.
"""
guard_symbol = "neutralize_cell"
guard_lines = [11, 20]

[twin]
defect = """
row 가 neutralize_cell 대신 quote_cell 을 부른다.
따옴표는 수식 시작을 막지 못해 =cmd|'...'!A1 같은 셀이 그대로 나간다.
"""
