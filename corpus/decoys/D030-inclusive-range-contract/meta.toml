decoy_id = "D030-inclusive-range-contract"
trap_kind = "contract_half_open"

[bait]
apparent_defect = """
비교가 low <= score <= high 로 양끝을 모두 포함하고 band_size 는 high - low + 1
로 1 을 더한다. 파이썬에서 구간은 보통 반열린 [low, high) 이므로 양쪽 다 상한을
한 칸 넘겨 세는 전형적인 off-by-one 으로 읽힌다.
"""
lure_lines = [9, 15]

[safety]
claim = "<= 비교와 +1 은 off-by-one 이 아니며 서로 일관된다"
justification = """
grade 의 독스트링이 구간을 [low, high] 포함적으로 선언하고 _BANDS 의 값이 그
계약을 따르기 때문에 (0,59) 다음이 (60,79) 로 이어져 경계에 빈틈이 없고, 상한을
포함하는 <= 가 그 계약과 정확히 일치한다. 같은 계약에서 원소 수는 high - low + 1
이므로 band_size 도 맞다. 둘을 반열린으로 바꾸면 59 · 79 · 89 · 100 점이 어느
구간에도 속하지 않아 ValueError 가 난다.
"""
guard_symbol = "grade"
guard_lines = [3, 11]

[twin]
defect = """
상한 비교가 < 로 바뀌어 각 구간의 마지막 점수가 어디에도 속하지 않는다.
59 · 79 · 89 · 100 점을 넣으면 ValueError 가 나고, band_size 와도 어긋난다.
"""
