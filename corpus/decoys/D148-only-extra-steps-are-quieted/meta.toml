decoy_id = "D148-only-extra-steps-are-quieted"
trap_kind = "exception_absorbed"

[bait]
apparent_defect = """
_quietly 가 except Exception 으로 단계가 던진 예외를 전부 삼키고 False 만 돌려준다. 게시에서 가장 중요한 저장이 실패해도 아무도
모르고 넘어가는, 실패를 조용히 삼키는 결함처럼 보인다.
"""
lure_lines = [9, 10]

[safety]
claim = "publish 는 save 가 던진 예외를 무엇이든 그대로 올리고 그때 extras 는 하나도 부르지 않는다. save 가 끝나면 publish 를 부른 때의 extras 의 자리마다(같은 단계가 여러 자리에 있으면 자리마다 · save 나 단계가 그 목록을 바꿔도 부를 자리는 그대로다) 차례대로 한 번씩 부르되 Exception 을 던진 단계는 세지 않고 넘어가며 (Exception 이 아닌 BaseException 은 그대로 올린다), 예외 없이 끝난 단계의 수를 돌려준다"
justification = """
save 는 publish 가 _quietly 를 거치지 않고 직접 부르므로, 그 예외는 어떤 것이든 publish 밖으로 그대로 올라가고 extras 를 도는
다음 줄에 닿지 않는다. _quietly 의 except Exception 은 extras 의 단계에만 걸리기 때문에 삼키는 것은 덧붙는 단계의 Exception
뿐이고, KeyboardInterrupt · SystemExit 처럼 Exception 이 아닌 BaseException 은 그 except 에 잡히지 않아 올라간다. 단계마다
_quietly 가 끝나면 True, Exception 이면 False 를 내고 sum 이 그 True 를 센다. 부를 단계는 save 앞에서 tuple 로 떠 두므로 save 나
단계가 extras 를 바꿔도 부를 자리가 바뀌지 않는다.
"""
guard_symbol = "publish"
guard_lines = [16, 16]

[twin]
defect = """
save 도 _quietly 를 거쳐 부른다. 저장이 Exception 으로 실패하면 그 예외가 삼켜지고, extras 는 저장되지 않은 글을 두고 그대로
불리며, publish 는 실패를 알리지 않고 단계 수를 돌려준다.
"""
