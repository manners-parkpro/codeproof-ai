decoy_id = "D024-cleanup-swallows-by-design"
trap_kind = "exception_absorbed"

[bait]
apparent_defect = """
_close_quietly 가 except Exception 으로 모든 예외를 잡아 pass 로 버린다.
로그도 남기지 않고 재전파도 하지 않는 형태라 오류를 조용히 감추는 전형적인
광범위 예외 삼킴으로 읽히고, 린터의 blind-except 룰이 그대로 걸린다.
"""
lure_lines = [15, 16]

[safety]
claim = "work 가 예외로 끝나면 호출자는 정리 실패(close 가 낸 Exception)가 아니라 그 예외를 받고, work 가 성공하면 정리 실패는 호출자에게 그대로 올라간다 - close 가 Exception 이 아닌 BaseException(KeyboardInterrupt · SystemExit 등)을 내면 그것이 올라가는 것은 이 주장이 말하지 않는다"
justification = """
_close_quietly 는 run 이 work 의 예외를 잡은 except 절에서만 호출되는데, 거기서 close 실패를
올리면 그 예외가 진행 중이던 원래 예외를 대체해 호출자에게 전파되기 때문에 호출자의
except 가 work 가 낸 진짜 오류 대신 정리 실패를 받는다 (원래 예외는 __context__ 로만 남는다).
그래서 실패 경로의 삼킴은 호출자가 받는 예외를 보존한다. work 가 성공하면 run 이 삼키지 않고
close 를 직접 부르므로 정리 실패는 그대로 올라가 감춰지지 않는다.
"""
guard_symbol = "_close_quietly"
guard_lines = [13, 16]

[twin]
defect = """
try/except 가 사라져 close 실패가 finally 밖으로 전파된다.
work 가 낸 원래 예외가 정리 단계의 예외로 대체되어 호출자에게 사라진다.
"""
