decoy_id = "D035-upstream-bounded-width"
trap_kind = "bounded_input"

[bait]
apparent_defect = """
_pad 가 호출자가 준 width 만큼 공백 문자열을 곱해서 만든다. 곱하는 수에 상한이
없는 형태라 큰 값이 들어오면 그 크기만큼 메모리를 잡는 자원 소진 경로로 읽히고,
함수 안에 어떤 방어도 없다.
"""
lure_lines = [6, 7]

[safety]
claim = "_pad 가 만드는 문자열은 _MAX_WIDTH 를 넘을 수 없다"
justification = """
_pad 는 비공개 함수이고 이 모듈에서 부르는 곳은 column 한 곳뿐인데, column 이
width 가 1 이상 120 이하가 아니면 ValueError 를 올려 빠져나가기 때문에 _pad 에
도달한 width 는 항상 그 범위 안이다. 따라서 공백 곱셈의 결과가 120 자를 넘을 수
없고, 같은 검사를 안쪽에 또 두면 경계값이 두 곳에 흩어져 어긋나기 쉬워진다.
"""
guard_symbol = "column"
guard_lines = [10, 15]

[twin]
defect = """
폭 범위 검사가 사라져 호출자가 주는 값이 그대로 공백 곱셈에 들어간다.
큰 수를 넘기면 그 크기만큼 문자열을 할당해 메모리가 고갈된다.
"""
