decoy_id = "D046-seeded-rng-is-not-a-secret"
trap_kind = "constant_only_sink"

[bait]
apparent_defect = """
secrets 가 아니라 random 모듈로 값을 뽑는다. 표준 의사난수는 예측 가능해서
보안 용도에 쓰면 안 된다는 것이 잘 알려진 규칙이라, 난수를 쓰는 함수가 보이면
비암호학적 난수 사용으로 읽히고 보안 린트 룰이 정확히 이 모양을 잡는다.
"""
lure_lines = [8, 11]

[safety]
claim = "이 난수는 예측 가능해도 결함이 아니다"
justification = """
이 값은 비밀이 아니라 버킷 번호이고 아무에게도 감춰지지 않으며 권한 판정에도
쓰이지 않기 때문에, 예측 가능성이 위험으로 이어지는 경로가 존재하지 않는다.
오히려 Random 에 key 를 seed 로 주어 출력이 완전히 결정적이 되는 것이 여기서
요구되는 성질이다 - 같은 키는 언제나 같은 버킷으로 가야 샤딩이 성립한다. 버킷은 random() 으로 고르고
시드는 호환 시더(version=2)에 주므로, 파이썬 판이 바뀌어도 같은 키는 같은 버킷이다 - 문서가 판 사이에
보장하는 것은 그 조합뿐이고 randrange 같은 다른 메서드는 아니다.
secrets 로 바꾸면 seed 를 줄 수단이 없어 그 요구가 깨진다.
"""
guard_symbol = "bucket_for"
guard_lines = [8, 11]

[twin]
defect = """
Random 에 seed 를 주지 않아 호출마다 다른 값이 나온다.
같은 키가 매번 다른 버킷으로 가서 샤딩이 성립하지 않는다.
"""
