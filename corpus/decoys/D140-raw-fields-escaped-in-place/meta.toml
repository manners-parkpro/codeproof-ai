decoy_id = "D140-raw-fields-escaped-in-place"
trap_kind = "misleading_name"

[bait]
apparent_defect = """
comment_html 이 raw_author · raw_body 라는 이름의 값을 f-string 으로 HTML 에 그대로 끼워 넣는다. 이름대로 날것의 사용자 입력이면
작성자 이름이나 본문에 <script> 나 다른 태그를 넣어 페이지에 끼워 넣는 XSS 결함처럼 보인다.
"""
lure_lines = [9, 9]

[safety]
claim = "comment_html 은 어떤 author · body 든 html.parser 로 읽으면 class 가 comment 인 p 요소 하나 안에 b 요소 하나와 글 · br 요소만 있는 조각을 돌려준다 - b 의 글은 author 그대로이고, b 뒤의 글은 ': ' 와 body 를 이은 것에서 \\n 만 뺀 것이고, body 의 \\n 은 하나마다 그 자리에서 br 요소 하나로 바뀌어 글에 남지 않는다. 다른 요소나 속성은 만들지 않는다"
justification = """
raw_ 라는 이름과 달리 두 값은 같은 함수의 첫 두 줄에서 html.escape(…, quote=True) 를 거친 것이라 & · < · > · 큰따옴표 · 작은따옴표가
문자 참조로 바뀌어 있다. 그래서 끼워 넣은 글 안에는 태그나 참조를 시작하는 글자가 날것으로 남지 않고, 파서는 그 참조를 원래 글자로
되돌려 author 와 body 를 그대로 읽는다. 본문의 \\n 은 이스케이프한 뒤에 <br> 로 바꾸므로 이 함수가 넣은 br 만 태그가 되고, 사용자가
쓴 "<br>" 글은 글로 남는다.
"""
guard_symbol = "comment_html"
guard_lines = [7, 8]

[twin]
defect = """
author 와 body 를 이스케이프하지 않는다. 작성자 이름에 "</b><script>…</script>" 를 넣으면 그 태그가 그대로 페이지에 들어간다.
"""
