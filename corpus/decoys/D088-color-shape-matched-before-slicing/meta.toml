decoy_id = "D088-color-shape-matched-before-slicing"
trap_kind = "upstream_validation"

[bait]
apparent_defect = """
parse_color 가 문자열을 고정 위치 [1:3] · [3:5] · [5:7] 로 잘라 int(…, 16) 에 넘긴다. 길이나 글자를
확인하지 않은 채 자르는 것처럼 보여, 짧은 값에서는 빈 조각으로 ValueError 가 나고 길거나 이상한
값은 엉뚱한 색으로 해석되는 입력 검증 누락으로 읽힌다.
"""
lure_lines = [12, 14]

[safety]
claim = "parse_color 가 돌려주는 세 값은 언제나 입력의 정확히 여섯 자리 16진수에서 나온다"
justification = """
같은 함수가 자르기 전에 code 를 _HEX_COLOR 전체와 맞춰 보고 맞지 않으면 ValueError 로 끝내므로,
자르는 줄에 닿는 code 는 # 다음에 0-9 · a-f 여섯 글자만 있는 일곱 글자다. 그래서 세 조각은 언제나 두
글자짜리 16진수이고 int 변환이 실패하거나 남는 글자를 버리는 일이 없으며, 값은 0~255 안에 든다.
"""
guard_symbol = "parse_color"
guard_lines = [10, 11]

[twin]
defect = """
형식 비교가 없다. #12345 · #1234567 · #+1+2+3 처럼 틀린 값이 예외 없이 엉뚱한 색으로 해석된다.
"""
