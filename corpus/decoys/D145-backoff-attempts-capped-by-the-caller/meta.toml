decoy_id = "D145-backoff-attempts-capped-by-the-caller"
trap_kind = "bounded_input"

[bait]
apparent_defect = """
_delays 가 호출자가 준 attempts 만큼 base × 2**n 을 담은 목록을 만든다. attempts 에 큰 값을 주면 목록이 끝없이 길어지고 2**n 이
거대한 정수가 되어, 재시도 설정 하나로 메모리와 시간을 잡아먹는 상한 없는 입력 결함으로 보인다.
"""
lure_lines = [8, 8]

[safety]
claim = "backoff 는 attempts 가 bool 이 아닌 1 이상 10 이하의 정수이고 base 가 0 보다 크고 60 이하이면 base × 2**n (n = 0, 1, …, attempts - 1) 을 차례로 담은 목록을 돌려주고 - 그래서 목록은 10개를 넘지 않고 가장 긴 대기는 60 × 512 = 30720 을 넘지 않는다 - 그 밖의 attempts(bool 포함)나 base(NaN · 무한대 포함)는 거절한다"
justification = """
_delays 를 부르는 곳은 backoff 하나이고, backoff 는 부르기 전에 attempts 가 bool 이 아닌지와 1 <= attempts <= 10, 0 < base <= 60 을
확인해 밖이면 거절한다. 그래서 range(attempts) 는 많아야 열 번 돌고 2**n 은 2**9 = 512 를 넘지 않으므로, 목록은 열 개 이하이고 값은
60 × 512 를 넘지 않는 유한한 수다. NaN 은 어떤 비교에서도 거짓이고 +무한대는 60 보다 커서, -무한대는 0 보다 크지 않아 base 확인에서
거절된다.
"""
guard_symbol = "backoff"
guard_lines = [12, 15]

[twin]
defect = """
backoff 가 attempts 를 확인하지 않는다. attempts 에 1000 을 주면 2**999 배까지 커지는 천 개짜리 목록을 만들고, 0 이나 음수에는
빈 목록을 돌려준다.
"""
