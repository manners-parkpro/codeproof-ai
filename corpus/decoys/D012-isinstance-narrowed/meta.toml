decoy_id = "D012-isinstance-narrowed"
trap_kind = "type_narrowed"

[bait]
apparent_defect = """
event.body 에 접근하는데 인자 타입이 합집합이라 BinaryEvent 가 들어올 수 있어 보인다.
BinaryEvent 에는 body 가 없으므로 AttributeError 로 읽히고, 유니온을 다루는
전형적인 실수처럼 보인다.
"""
lure_lines = [19, 19]

[safety]
claim = "event.body 는 AttributeError 를 낼 수 없다"
justification = """
바로 위 두 줄의 isinstance 검사가 TextEvent 가 아닌 경우를 먼저 처리해 반환하기
때문에, 19행에 도달한 event 는 반드시 TextEvent 다. 따라서 body 속성이 항상
존재한다. 이 형태는 타입 검사기도 좁힘으로 인정하는 표준 패턴이고,
분기 순서를 뒤집어도 의미는 같다.
"""
guard_symbol = "summarize"
guard_lines = [17, 18]

[twin]
defect = """
isinstance 검사가 사라져 BinaryEvent 가 그대로 19행에 도달한다.
body 속성이 없으므로 AttributeError 가 난다.
"""
