decoy_id = "D022-validated-nonzero-divisor"
trap_kind = "upstream_validation"

[bait]
apparent_defect = """
_weighted 가 sum(weights) 로 나누는데 그 값이 0 인지 확인하지 않는다.
가중치가 비어 있거나 전부 0 이면 ZeroDivisionError 가 나는 전형적인
분모 미검사로 읽히고, 함수 안 어디에도 방어가 없다.
"""
lure_lines = [5, 6]

[safety]
claim = "_weighted 의 나눗셈은 ZeroDivisionError 를 낼 수 없다"
justification = """
_weighted 는 비공개 함수이고 이 모듈에서 부르는 곳은 average 한 곳뿐인데,
average 가 weights 가 비었거나 합이 0 이하이면 ValueError 를 올려 빠져나가기
때문에 _weighted 에 도달한 weights 는 합이 반드시 양수다. 따라서 분모가 0 이
될 수 없다. 안쪽에 같은 검사를 두면 같은 계산을 두 번 하게 된다.
"""
guard_symbol = "average"
guard_lines = [9, 12]

[twin]
defect = """
합이 양수인지 확인하는 검사가 사라져 가중치가 전부 0 이거나 비어 있으면
sum(weights) 가 0 이 되고 나눗셈에서 ZeroDivisionError 가 난다.
"""
