decoy_id = "D070-unsafe-pattern-is-already-escaped"
trap_kind = "misleading_name"

[bait]
apparent_defect = """
사용자 검색어가 unsafe_pattern 이라는 이름 그대로 re.sub 의 패턴 자리에 들어간다. 검색어에 점이나
괄호 같은 메타문자가 섞이면 의도하지 않은 부분이 강조되고, (a+)+ 같은 입력이면 파국적 역추적으로
요청이 멈추는 정규식 인젝션으로 읽힌다.
"""
lure_lines = [9, 10]

[safety]
claim = "highlight 의 검색어는 정규식 메타문자로 해석되지 않는다"
justification = """
unsafe_pattern 은 이름과 달리 re.escape(term) 의 결과이고, re.escape 는 정규식에서 뜻을 갖는 모든
문자 앞에 역슬래시를 붙이므로 패턴은 검색어와 글자 그대로 같은 문자열에만 맞는다. 사용자가 넣은
수량자나 괄호도 리터럴 문자가 되기 때문에 역추적을 일으킬 반복 구조가 패턴에 생기지 않고, 치환은
함수가 돌려준 m.group(0) 을 그대로 넣으므로 치환 쪽 역참조도 해석되지 않는다.
"""
guard_symbol = "highlight"
guard_lines = [9, 9]

[twin]
defect = """
unsafe_pattern 에 검색어를 이스케이프 없이 그대로 담는다. 점 하나로 개행을 뺀 모든 글자가 강조되고 여는
대괄호 하나면 re.error 로 요청이 실패하며, 중첩 수량자를 넣으면 본문 길이에 지수적으로 느려진다.
"""
