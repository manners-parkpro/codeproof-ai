decoy_id = "D095-only-blank-lines-are-skipped"
trap_kind = "exception_absorbed"

[bait]
apparent_defect = """
load 가 줄마다 try 로 감싸 예외가 나면 continue 로 넘어간다. 실패한 줄을 기록도 알림도 없이 버리는 것처럼
보여, 형식이 틀린 줄이 조용히 빠져 수량표 일부가 사라지는 예외 삼킴(데이터 유실)으로 읽힌다.
"""
lure_lines = [18, 21]

[safety]
claim = "load 는 공백뿐인 줄만 건너뛴다 - 쉼표가 하나가 아니거나 수량을 int 로 읽을 수 없는 줄은 ValueError 로 올라가고, 조용히 버리는 줄이 없다"
justification = """
load 의 except 절이 받는 것은 _BlankLine 하나다. 그 예외는 이 모듈의 비공개 클래스이고 _row 가 공백뿐인 줄에서
직접 던질 때만 생기므로, 건너뛰는 줄은 빈 줄뿐이다. 쉼표 개수가 틀린 줄은 두 이름으로 푸는 대입이, 수량이
정수가 아닌 줄은 int 가 ValueError 를 내고, 그 예외는 except 절에 걸리지 않아 load 밖으로 올라간다.
"""
guard_symbol = "_BlankLine"
guard_lines = [20, 20]

[twin]
defect = """
except 절이 ValueError 도 받는다. 쉼표가 빠졌거나 수량이 숫자가 아닌 줄이 알림 없이 사라진다.
"""
