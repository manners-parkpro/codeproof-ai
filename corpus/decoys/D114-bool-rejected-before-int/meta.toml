decoy_id = "D114-bool-rejected-before-int"
trap_kind = "type_narrowed"

[bait]
apparent_defect = """
to_cents 가 isinstance(amount, int) 로 정수 금액을 고른다. bool 은 int 의 하위 타입이라 JSON 의 true 같은 값이 이 분기를
타 1달러(100센트)로 바뀌는 타입 혼동 결함으로 읽힌다.
"""
lure_lines = [11, 12]

[safety]
claim = "to_cents 는 True · False 를 금액으로 바꾸지 않고, bool 이 아닌 int(하위 클래스 포함)는 100배로 · 정수 15자리 · 소수 둘째 자리까지의 문자열은 정확한 센트로 바꾼다"
justification = """
bool 은 int 의 하위 타입이라 isinstance(amount, int) 가 True · False 에도 참이지만, to_cents 는 그 분기보다 먼저
isinstance(amount, bool) 을 보고 TypeError 로 끝내므로 정수 분기에 닿는 값은 언제나 bool 이 아닌 int 다. 그래서 True 가
100센트로, False 가 0센트로 바뀌는 일이 없고, 정수 0 · 1 과 IntEnum 같은 int 하위 클래스는 bool 이 아니라서 그대로
100배가 된다. 문자열은 뒤의 정규식이 ASCII 숫자 15자리와 소수 둘째 자리까지만 받아 정수 연산으로 센트를 만들므로
float 반올림도 정수 문자열 변환 한도도 끼지 않는다.
"""
guard_symbol = "to_cents"
guard_lines = [9, 10]

[twin]
defect = """
to_cents 가 bool 을 먼저 거르지 않는다. True 가 정수 분기를 타 100센트, False 가 0센트로 바뀌어 참 · 거짓이 금액으로
처리된다.
"""
