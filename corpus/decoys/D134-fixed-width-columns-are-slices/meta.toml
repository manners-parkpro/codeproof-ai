decoy_id = "D134-fixed-width-columns-are-slices"
trap_kind = "contract_half_open"

[bait]
apparent_defect = """
parse 가 명세의 나이 칸(21~23열)을 slice(20, 23) 으로, 도시 칸(24~40열)을 slice(23, 40) 으로 자른다. 명세의 끝 열은 포함인데 조각의
끝은 빠지는 반열린 구간이라, 칸마다 첫 글자나 마지막 글자를 잃거나 옆 칸 글자를 섞는 off-by-one 처럼 보인다.
"""
lure_lines = [11, 11]

[safety]
claim = "parse 는 길이가 정확히 40 인 줄을 명세의 열(글자 하나가 한 열, 1부터 센 포함 구간: 이름 1~20 · 나이 21~23 · 도시 24~40)대로 나눠, 각 칸에서 오른쪽 끝의 공백(U+0020)만 지운 글을 name · age · city 로 돌려주고, 길이가 다르면 거절한다 - 그래서 세 칸은 명세의 첫 열부터 끝 열까지를 빠짐없이 겹침 없이 담는다"
justification = """
_FIELDS 는 명세의 1부터 센 포함 구간 [a, b] 를 파이썬의 0부터 센 반열린 조각 slice(a - 1, b) 로 옮겨 둔 표다. 시작은 하나를 빼고
끝은 그대로 두므로 조각은 정확히 a 열부터 b 열까지의 b - a + 1 글자를 담고, 이름 0~20 · 나이 20~23 · 도시 23~40 은 앞 칸의 끝이 다음
칸의 시작이라 빈틈도 겹침도 없다. 길이 확인이 40 이 아닌 줄을 거절하기 때문에 마지막 칸이 짧게 잘리는 일도 없고, rstrip(" ") 은
오른쪽 끝의 공백만 지운다.
"""
guard_symbol = "_FIELDS"
guard_lines = [4, 4]

[twin]
defect = """
명세의 열 번호를 그대로 조각 경계로 쓴다. 칸마다 첫 글자(1 · 21 · 24열)를 잃는다 - 이름은 2열부터, 나이는 22~23열만 담긴다.
"""
