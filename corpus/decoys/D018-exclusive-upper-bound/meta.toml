decoy_id = "D018-exclusive-upper-bound"
trap_kind = "contract_half_open"

[bait]
apparent_defect = """
contains 가 상한에 < 를 쓰고 size 가 high - low 를 그대로 돌려준다. 둘 다
상한이 포함이라고 가정하면 각각 한 칸씩 틀린 off-by-one 이고, <= 와 +1 로
고치라는 지적이 나오기 쉽다. 두 함수가 서로 다른 관례를 쓴 것처럼도 보인다.
"""
lure_lines = [18, 22]

[safety]
claim = "contains 와 size 는 off-by-one 이 아니며 서로 일관된다"
justification = """
Range 의 독스트링이 [low, high) 반열린 구간을 선언하므로 high 는 애초에 포함
대상이 아니고, contains 의 < 가 그 계약과 정확히 일치한다. 같은 계약에서
원소 수는 high - low 이므로 size 도 맞다. 둘을 <= 와 +1 로 바꾸면 계약을
어기면서 서로에 대해서도 어긋난다. __post_init__ 이 high <= low 를 거부하므로
빈 구간이나 역전된 구간이 만들어질 수도 없다.
"""
guard_symbol = "__post_init__"
guard_lines = [8, 15]

[twin]
defect = """
__post_init__ 검증이 사라져 high <= low 인 Range 를 만들 수 있다.
size 가 0 이나 음수를 돌려주고, contains 는 어떤 값에도 False 를 내
호출부가 빈 결과를 정상으로 오해한다.
"""
