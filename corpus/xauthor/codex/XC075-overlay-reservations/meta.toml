decoy_id = "XC075-overlay-reservations"
trap_kind = "defensive_copy"

[bait]
apparent_defect = "working[sku]의 제자리 차감이 호출자의 재고 사전을 변경하고, 여러 예약 중 뒤의 예약이 거절되면 앞선 차감만 원본에 남는 것처럼 보인다."
lure_lines = [12, 20]

[safety]
claim = "preview_reservations는 선언 타입의 모든 stock과 requests에 대해 정상 반환하거나 동기 예외로 종료할 때 원본 사전의 키와 값의 참조 및 순서를 보존한다. 초기 재고 중 음수가 있으면 거절하며, 그렇지 않으면 요청을 순서대로 처리하여 음수 수량, 없는 품목 또는 당시 잔량을 초과하는 수량에서 거절한다. 그 밖에는 모든 초기 품목을 유지하고 각 요청 수량만큼 순차 차감한 사전을 반환한다. 빈 재고, 빈 요청, 중복 요청과 0 수량도 같은 규칙을 따른다. 정상 반환한 사전과 원본 어느 쪽의 항목 대입, 삭제, 추가, clear, update, pop, setdefault 및 |= 변경도 반대쪽 사전의 항목과 순서를 바꾸지 않는다."
justification = "ChainMap은 새 빈 사전을 첫 번째 층으로, 원본 재고를 뒤쪽 읽기 층으로 둔다. 따라서 기존 재고 조회는 가능하지만 증감 대입은 항상 새 앞쪽 사전에만 기록되고 원본 키와 값은 변경되지 않는다. 요청이 중간에 거절되어도 변경분은 지역 사전에만 남는다. 반환 시 dict가 두 층의 최종 항목을 별도 사전에 담으며 선언된 키와 값은 불변 문자열과 정수이므로 양쪽 사전의 후속 항목 변경도 서로 전파되지 않는다."
guard_symbol = "ChainMap"
guard_lines = [9, 9]

[twin]
defect = "변경분 사전과 원본의 분리가 사라져 working이 원본 자체가 되므로 정상 차감과 중간 거절 전 차감이 호출자의 재고를 직접 변경한다."
