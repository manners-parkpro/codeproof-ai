decoy_id = "XC009-event-retry"
trap_kind = "idempotent_retry"

[bait]
apparent_defect = "커밋 뒤 acknowledge()가 TimeoutError를 내면 deliver가 INSERT를 재실행하므로 동일 이벤트가 여러 번 기록되는 것으로 보인다."
lure_lines = [49, 55]

[safety]
claim = "한 스레드에서 공개 API로 도달한 열린 EventJournal의 모든 상태에서, 모든 str 식별자와 본문(평범한 하위 타입 포함)에 대해 record 및 양수 attempts의 deliver는 확인 응답의 성공·동기 예외·재시도 횟수와 무관하게 식별자마다 최초 본문 하나만 보존한다. 서로 다른 식별자는 본문이 같아도 각각 보존하며, 비양수 attempts는 기록을 변경하지 않는다. 확인 콜백 자체의 외부 효과는 주장하지 않는다."
justification = """
event_id의 NOT NULL PRIMARY KEY가 동일한 식별자의 두 번째 행을 거부하고 INSERT의 ON CONFLICT DO NOTHING이 그 충돌을 무해하게 처리하므로 재시도는 최초 본문을 덮어쓰거나 중복 행을 추가하지 않는다. 식별자와 본문은 surrogatepass UTF-8 바이트로 손실 없이 저장되어 빈 문자열, NUL, 고립 서로게이트 및 일반 문자열 하위 타입도 동일한 규칙을 따른다. 본문에는 유일성 제약이 없어서 서로 다른 식별자는 같은 본문을 공유할 수 있다. 트랜잭션을 커밋한 다음에만 확인 콜백을 부르기 때문에 콜백의 동기 예외는 이미 기록한 이벤트를 되돌리지 않으며, 다음 호출에서도 기본 키 제약이 유지된다. 비양수 attempts는 반복문 전에 거절되어 기존 상태를 변경하지 않는다. 자원 고갈, 비공개 연결 변경, 전역 어댑터 monkeypatch 및 동시 호출은 범위 밖이다.
"""
guard_symbol = "_SCHEMA"
guard_lines = [7, 12]

[twin]
defect = "event_id의 기본 키 제약만 제거되어, 커밋 후 확인 응답 유실에 따른 재시도가 동일 식별자의 행을 중복 삽입한다."
