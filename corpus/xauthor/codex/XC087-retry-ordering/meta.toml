decoy_id = "XC087-retry-ordering"
trap_kind = "idempotent_retry"

[bait]
apparent_defect = "deliver는 제자리 교환으로 배치의 순서를 변경한 뒤 확인 콜백의 TimeoutError를 잡고 교환을 재실행하므로, 응답이 유실되면 교환이 중복 적용되어 정렬된 우선순위가 다시 뒤집히는 것으로 보인다."
lure_lines = [23, 29]

[safety]
claim = "한 스레드에서 모든 list[int] priorities로 생성한 PriorityBatch의 snapshot은 입력의 정수값을 순서와 중복 개수 그대로 나타낸다. 원본 리스트를 이후 변경해도 배치의 상태는 바뀌지 않는다. 생성과 순차적인 공개 API 호출로 도달한 모든 상태에서 호출 직전 snapshot을 s라 하면, 모든 int attempts에 대한 deliver의 정상 종료 또는 동기 예외 전파 뒤 snapshot은 attempts가 양수이면 s의 모든 값을 중복 개수 그대로 보존하여 오름차순으로 정렬한 수열이고 비양수이면 s이다. 호출된 각 확인 콜백 안에서 조회한 snapshot도 해당 호출에 규정된 같은 수열이다. 리스트에는 빈 값과 메서드를 재정의하지 않은 하위 클래스가, int에는 임의 크기의 양수와 음수, 0, bool, IntEnum, IntFlag 및 메서드를 재정의하지 않은 하위 타입이 포함된다. 확인 응답의 성공, 동기 예외 및 재시도 횟수와 무관하게 성립하며 콜백은 snapshot 조회만으로 배치에 재진입할 수 있다. snapshot의 컨테이너 종류와 원소의 구체적인 타입, deliver 반환값, 예외 타입, 콜백 호출 횟수와 외부 효과 및 동시 호출은 주장하지 않는다."
justification = "생성자는 입력 정수값을 별도 리스트에 복사하므로 이후 원본 변경이 배치에 전파되지 않는다. _order는 각 접두부에 다음 원소를 삽입하면서 왼쪽 값이 더 클 때만 이웃을 교환한다. 따라서 매 단계 접두부가 오름차순이고 교환은 값과 중복 개수를 보존한다. 완료된 정렬에는 역순 이웃이 없으므로 같은 루틴을 다시 실행해도 교환이 전혀 일어나지 않는다. 콜백은 정렬 완료 뒤에만 실행되며 양수가 아닌 attempts에서는 반복문 자체가 실행되지 않는다."
guard_symbol = "_order"
guard_lines = [13, 20]

[twin]
defect = "_order의 역순 비교를 제거하여 각 원소를 무조건 맨 앞으로 이동시킨다. 이 루틴은 매번 배치를 뒤집으므로 [3, 2, 1]의 첫 확인 응답이 TimeoutError를 내면 두 번째 시도에서 정렬 결과 [1, 2, 3]이 다시 [3, 2, 1]로 손상된다."
