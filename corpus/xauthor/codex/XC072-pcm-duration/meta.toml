decoy_id = "XC072-pcm-duration"
trap_kind = "bounded_input"

[bait]
apparent_defect = "하위 함수가 외부 재생 시간에서 계산된 표본 수를 두 배로 곱해 바로 bytearray를 만들므로, 큰 무음 미리 듣기 요청이 제한 없이 PCM 저장 공간을 할당할 것처럼 보인다."
lure_lines = [6, 7]

[safety]
claim = "silence_preview는 평범한 하위 타입을 포함한 모든 float 입력과 매 호출에서, NaN과 양쪽 무한대는 동기 예외로 거절하고, 유한한 값은 0.0초 미만이면 0.0초로, 0.5초 초과이면 0.5초로 포화시킨 시간에 16000을 곱한 파이썬 부동소수점 결과의 내림값을 표본 수로 사용하여 그 두 배 길이의 새 bytearray를 반환한다. 반환 바이트는 모두 0이고 길이는 항상 0 이상 16000 이하이며, 이전 반환 버퍼를 호출자가 변경해도 이후 호출의 결과에는 영향이 없다."
justification = "isfinite 검사로 NaN과 무한대를 먼저 배제하고 min과 max가 유한한 초 값을 닫힌 구간 0.0 이상 0.5 이하에 포화시키므로, 곱셈은 극단적인 유한 입력에서도 이 구간의 값에만 적용된다. 따라서 환산 결과는 0 이상 8000 이하이고 비음수 int 변환은 내림과 같으며 하위 함수가 받는 표본 수 역시 8000 이하이다. bytearray는 매번 새로 생성되어 모든 바이트가 0으로 초기화되므로 이전 버퍼의 변경이나 앞선 호출의 성공 및 거절이 다음 결과를 바꾸지 않는다."
guard_symbol = "silence_preview"
guard_lines = [10, 14]

[twin]
defect = "상한 포화를 제거했으므로 0.5초를 초과하는 유한 요청에서 16000바이트를 넘는 PCM 버퍼를 생성하고, 요청 시간을 늘리면 할당 크기도 계속 증가한다."
