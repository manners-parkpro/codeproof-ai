decoy_id = "XC021-cleanup-drain"
trap_kind = "exception_absorbed"

[bait]
apparent_defect = "정리 콜백의 모든 BaseException을 pass로 삼키므로 하나의 실패 뒤 남은 정리를 누락하고, 취소나 종료 예외에도 정리 순회를 중단한 사실을 숨기는 것처럼 보인다."
lure_lines = [16, 20]

[safety]
claim = "동시 호출이 없는 CleanupStack에서 register는 같은 콜백의 중복 등록도 각각 보관하며, 각 drain은 진입 시 보관된 모든 등록 항목을 역순으로 정확히 한 번씩 호출하고 콜백의 반환값이나 어떤 동기 BaseException에도 나머지 호출을 계속하며 예외를 전파하지 않는다. 소비한 항목은 이후 drain에서 재시도하지 않고, 실행 중 새로 등록한 항목은 그 등록 이후 시작하는 drain을 위해 보관한다. 재진입 drain도 이 규칙을 따른다. 실제 자원의 정리 성공은 보장하지 않는다."
justification = "drain은 먼저 기존 목록을 지역 변수로 옮기고 인스턴스에는 새 빈 목록을 설치하기 때문에 재진입 호출이나 이후 호출은 이미 소비 중인 항목을 다시 가져갈 수 없다. reversed는 등록 항목을 중복까지 보존하여 역순으로 순회한다. 각 callback 호출만 개별 try와 except BaseException 안에 있으므로 동기 실패는 현재 항목에서 흡수되고 다음 항목으로 진행한다. 실행 중 register는 새 목록에 추가하며 기존 순회의 종료 시 그 목록을 덮어쓰지 않으므로 새 등록도 유지된다."
guard_symbol = "drain"
guard_lines = [13, 20]

[twin]
defect = "try를 반복문 전체로 넓히면 첫 실패에서 순회가 끝나며 아직 호출하지 않은 정리 항목이 소실된다. 등록 목록은 이미 분리했으므로 이후 drain도 누락 항목을 복구하지 못한다."
