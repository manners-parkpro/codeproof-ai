decoy_id = "XC036-translation-snapshot"
trap_kind = "frozen_after_init"

[bait]
apparent_defect = "table()이 전역 변환표의 버퍼 뷰를 그대로 노출하고 normalize()도 같은 전역을 읽으므로, 초기화 원본이나 뷰 및 obj를 변경하거나 뷰를 해제하면 이후 요청의 변환을 오염시키거나 중단시킬 수 있어 보인다."
lure_lines = [8, 13]

[safety]
claim = "모듈 초기화 후 BOOTSTRAP, TRANSLATION, table()이 반환한 뷰와 그 슬라이스·cast 뷰 및 obj에 대한 일반적인 항목·슬라이스 대입, 삭제, 컨테이너 변경·크기 변경과 반환 뷰 해제를 어떤 순서로 시도해도, 이후 모든 bytes data(일반 하위 타입 포함)에 대해 normalize(data)는 예외 없이 ASCII 소문자만 대문자로 바꾼 bytes를 반환하며 새 table()은 그 256바이트 변환표를 제공한다."
justification = "모듈의 TRANSLATION = bytes(BOOTSTRAP)는 가변 초기화 버퍼의 내용을 독립적인 불변 bytes 값으로 확정한다. 따라서 원본의 길이나 항목을 나중에 변경해도 변환표는 변하지 않고, 전역 bytes 자체와 뷰가 노출하는 obj에는 일반적인 버퍼 쓰기나 컨테이너 변경이 허용되지 않는다. 슬라이스와 cast 역시 같은 불변 버퍼를 가리키므로 쓰기를 허용하지 않는다. table()은 호출마다 새 memoryview를 생성하므로 반환 뷰를 해제해도 다른 뷰나 전역 bytes와 normalize()의 translate 호출에는 영향이 없다. 초기 표는 0부터 255까지 모두 포함하고 ASCII 소문자 구간만 치환하므로 모든 bytes 입력에서 같은 변환이 성립한다."
guard_symbol = "TRANSLATION"
guard_lines = [5, 5]

[twin]
defect = "bytes 확정을 생략하여 TRANSLATION이 BOOTSTRAP bytearray의 별칭이다. 원본, 반환 뷰 또는 obj를 쓰면 요청 변환이 바뀌며, 원본 크기를 바꾸면 translate가 ValueError를 낼 수 있다."
