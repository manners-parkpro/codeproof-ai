decoy_id = "XC078-alignment-padding"
trap_kind = "idempotent_retry"

[bait]
apparent_defect = "align은 용량에 패딩을 더한 뒤 확인 콜백의 TimeoutError를 잡고 덧셈을 반복하므로, 응답이 유실되면 같은 정렬 단위가 중복 반영되어 필요 이상으로 용량이 증가하는 것으로 보인다."
lure_lines = [29, 34]

[safety]
claim = """한 스레드에서 모든 int initial에 대해 AllocationSize 생성은 음수이면 예외로 거절하고, 비음수이면 snapshot이 initial과 같은 정수값을 나타낸다. 생성과 순차적인 공개 API 호출로 도달한 모든 상태에서 호출 직전 용량을 s라 할 때, 모든 int quantum과 attempts에 대한 align의 정상 종료 또는 동기 예외 전파 뒤 snapshot은 quantum과 attempts가 모두 양수이면 s 이상인 quantum의 최소 정수 배수이고, 그 밖에는 s이다. 호출된 확인 콜백 안에서 조회한 snapshot도 해당 호출에 규정된 같은 값이다. int에는 임의 크기의 양수와 음수, 0, bool, IntEnum, IntFlag 및 메서드를 재정의하지 않은 하위 타입이 포함된다. 확인 응답의 성공, 동기 예외 및 재시도 횟수와 무관하게 성립하며 콜백은 snapshot 조회만으로 재진입할 수 있다. align 반환값, 예외 타입, 콜백 호출 횟수와 외부 효과 및 동시 호출은 주장하지 않는다."""
justification = """초기값을 내장 정수로 변환한 뒤 음수를 거절하므로 용량은 항상 비음수이다. quantum도 내장 정수로 바꾸고 비양수를 갱신 전에 거절하며, 비양수 attempts에서는 반복문이 실행되지 않기 때문에 원래 값이 유지된다. 양수 quantum을 q, 기존 용량을 s라 하면 _padding의 바깥 나머지 연산은 q - s % q를 0 이상 q 미만으로 제한한다. 따라서 첫 덧셈 결과는 s 이상인 q의 최소 배수이고, 이미 정렬되었거나 재시도하는 경우에는 s % q가 0이므로 증가량이 0이다. 이 계산은 부동소수점이나 고정 폭 정수를 쓰지 않아 임의 크기에서도 정확하다. 덧셈을 완료한 다음에만 확인 콜백을 호출하고 예외 처리에서는 용량을 되돌리지 않기 때문에, 콜백에서 관측하거나 동기 예외가 전파된 뒤에도 같은 결과가 남는다. 각 호출은 현재 용량과 그 호출의 quantum으로 다시 계산하므로 다른 정렬 단위를 순차적으로 사용한 상태에서도 같은 불변식이 유지된다."""
guard_symbol = "_padding"
guard_lines = [6, 7]

[twin]
defect = "_padding의 바깥 나머지 연산을 제거하여 이미 정렬된 용량에도 quantum을 더한다. 예를 들어 5를 8로 정렬한 뒤 확인 응답이 유실되면 다음 시도는 8에서 16으로 증가시켜 최소 배수라는 주장을 위반한다."
