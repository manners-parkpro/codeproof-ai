decoy_id = "XC041-decimal-grammar"
trap_kind = "bounded_input"

[bait]
apparent_defect = "하위 함수가 외부 숫자 문자열을 int로 변환한 즉시 bytearray를 할당하므로, 큰 패딩 요청이 제한 없이 메모리를 할당할 것처럼 보인다."
lure_lines = [9, 10]

[safety]
claim = "reserve_padding은 평범한 하위 타입을 포함한 모든 str 입력과 매 호출에서, 입력이 ASCII 십진수의 표준 표기인 0 또는 선행 0 없는 1~4자리 양수이면 그 수와 길이가 같고 모든 바이트가 0인 bytearray를 반환하고, 그 밖의 문자열은 하위 할당 함수에 도달하기 전에 동기 예외로 거절하므로 반환 버퍼 길이는 항상 0 이상 9999 이하이다."
justification = "같은 파일의 _COUNT 패턴은 0 하나 또는 0 아닌 ASCII 숫자로 시작하는 최대 네 자리를 나타내며, reserve_padding이 fullmatch로 문자열 전체를 검사하기 때문에 접두사 뒤의 추가 숫자, 공백, 부호, 밑줄 및 비ASCII 숫자는 통과하지 못한다. 따라서 _allocate로 전달되는 문자열을 십진수로 변환한 값은 정확히 0부터 9999까지이고 bytearray는 그 길이의 영 바이트 버퍼를 만든다."
guard_symbol = "reserve_padding"
guard_lines = [13, 15]

[twin]
defect = "전체 일치 검사를 접두사 일치로 바꾸어 10000 같은 다섯 자리 요청도 통과한다. 하위 함수는 접두사가 아닌 원문 전체를 정수로 변환하므로 9999를 넘는 버퍼를 할당한다."
