decoy_id = "XC015-stream-preview"
trap_kind = "bounded_input"

[bait]
apparent_defect = "하위 수집기가 입력 이터레이터를 list(records)로 끝까지 수집하므로, 긴 이벤트 스트림에서 무제한으로 항목을 저장하거나 무한 스트림에서 끝나지 않을 것처럼 보인다."
lure_lines = [11, 12]

[safety]
claim = "preview는 모든 Iterable[str] 입력에서 현재 읽기 위치부터 최대 64개 항목만 요청하고, 입력이 그 전에 끝나면 거기까지의 항목을 순서와 값의 변경 없이 Sequence로 반환한다. 정상 반환 컨테이너의 항목 수는 0 이상 64 이하이며, 64개를 읽기 전에 입력에서 발생한 동기 예외는 호출자에게 전파된다. 이 상한은 길이를 알 수 없거나 무한한 입력에도 적용되며 항목 수에 관한 것으로, 개별 문자열의 크기나 입력 생산자의 내부 할당은 제한하지 않는다."
justification = "preview가 원본 입력을 islice(records, 64)로 감싼 뒤 하위 수집기로 전달하기 때문에 수집기가 끝까지 반복하더라도 원본에서 65번째 항목을 요청할 수 없다. islice는 현재 커서부터 항목을 그대로 전달하고 원본의 종료 또는 동기 예외를 전파하므로 짧은 입력의 접두부와 오류 의미도 보존된다. 따라서 list(records)에 독자적인 길이 검사가 없어도 공개 진입점을 통한 수집 결과는 최대 64개 항목으로 제한된다."
guard_symbol = "preview"
guard_lines = [7, 8]

[twin]
defect = "preview가 islice 가드를 우회하여 원본을 하위 수집기로 직접 전달한다. 65개 이상의 이벤트가 있으면 반환 컨테이너가 64개를 초과하며, 무한 입력에서는 수집이 끝나지 않고 계속 항목을 저장한다."
