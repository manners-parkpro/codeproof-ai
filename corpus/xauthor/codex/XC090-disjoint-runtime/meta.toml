decoy_id = "XC090-disjoint-runtime"
trap_kind = "upstream_validation"

[bait]
apparent_defect = "occupied_ticks는 각 반열린 구간의 길이를 sum으로 더할 뿐 합집합을 구하지 않으므로 중복·포함·교차하는 작업 구간의 점유 시간을 이중 계산하거나 역전된 구간의 음수 길이를 차감할 것처럼 보인다."
lure_lines = [16, 16]

[safety]
claim = "동시 입력 변경이 없는 occupied_ticks 호출은 선언 타입의 모든 입력에서 각 (start, end)를 정수 틱의 반열린 구간 [start, end)로 해석한다. start > end인 구간이 하나라도 있거나 서로 다른 두 구간의 교집합에 정수 틱이 하나라도 있으면 예외로 거절한다. 그 외에는 모든 구간의 합집합에 속하는 정수 틱의 개수를 정수로 반환한다. start == end인 빈 구간은 어디에 몇 번 있어도 허용하며 빈 입력의 결과는 0이다. 입력 순서는 수락과 결과에 영향을 주지 않고 맞닿은 구간은 허용한다. 음수 좌표와 임의 크기 정수에도 같은 규칙을 적용하며 성공과 거절 모두 입력을 변경하지 않는다."
justification = "먼저 모든 구간에서 시작이 끝보다 큰지 검사하므로 음수 길이는 합산에 도달하지 못한다. 이어 양의 길이 구간만 새 목록으로 정렬하고 인접 구간의 앞 끝과 뒤 시작을 비교한다. 정렬된 양의 길이 구간에 중첩이 있다면 인접 쌍 중에도 중첩이 반드시 있으므로 이 검사로 모든 중첩을 거절한다. 따라서 통과한 구간은 서로소이고 각 end - start의 합은 정확히 합집합의 틱 수다. 빈 구간은 길이가 0이며 정렬 대상에서 제외되어 중첩 판단을 방해하지 않는다. 정수 연산과 새 목록의 정렬만 사용하므로 좌표 크기나 입력 순서에 의존하지 않고 원본도 수정하지 않는다."
guard_symbol = "_validate_intervals"
guard_lines = [4, 11]

[twin]
defect = "_validate_intervals 호출을 제거하여 [(0, 5), (3, 8)]을 거절하지 않고 10을 반환한다. 실제 합집합은 8틱이며 중첩된 2틱이 두 번 계산된다."
