decoy_id = "XC082-run-budget"
trap_kind = "bounded_input"

[bait]
apparent_defect = "하위 복원 함수가 외부 런의 반복 횟수만큼 바이트를 생성하는 중첩 제너레이터 전체를 bytearray로 수집하므로, 큰 반복 횟수나 작은 런 여러 개로 제한 없는 버퍼를 할당할 것처럼 보인다."
lure_lines = [4, 5]

[safety]
claim = "decode_runs는 평범한 하위 타입을 포함한 모든 list[tuple[int, int]] 입력과 매 호출에서, 모든 바이트 값이 0 이상 255 이하이고 모든 반복 횟수가 음이 아닌 정수이며 그 합계가 4096 이하이면 각 바이트를 해당 횟수만큼 입력 순서대로 반복한 내용의 새 bytearray를 반환하고, 그 밖에는 동기 예외로 거절한다. 따라서 빈 입력과 0회 반복도 허용하며 반환 길이는 항상 0 이상 4096 이하이고, 입력 목록을 변경하지 않으며 이전 반환 버퍼의 변경은 이후 호출에 영향을 주지 않는다."
justification = "decode_runs는 남은 예산을 호출마다 4096으로 초기화하고 각 런의 바이트 범위와 음수 횟수를 먼저 검사한다. 횟수가 남은 예산을 넘으면 거절하며 그렇지 않으면 그 횟수를 예산에서 차감하므로, accepted에 보관되는 양수 횟수의 합은 항상 4096 이하이다. 0회 반복은 보관하지 않아 중간 목록의 항목 수도 제한되며, 검사를 모두 마친 목록만 하위 복원 함수로 전달하므로 복원 버퍼 역시 같은 상한을 지킨다. 입력을 쓰지 않고 각 호출에서 새 목록과 버퍼를 생성하므로 호출 간 결과도 독립이다."
guard_symbol = "decode_runs"
guard_lines = [9, 18]

[twin]
defect = "남은 예산과 반복 횟수를 비교하는 가드가 제거되어, 단일 런 또는 여러 런의 합계가 4096을 넘더라도 그 전체를 복원하는 버퍼를 할당한다."
