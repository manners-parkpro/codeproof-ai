decoy_id = "XC054-interval-tree-pruning"
trap_kind = "contract_half_open"

[bait]
apparent_defect = "하위 트리의 최대 끝점이 질의 시작점과 같아도 <= 비교로 트리를 통째로 건너뛰고, 최소 시작점이 질의 끝점과 같아도 >= 비교로 건너뛰므로 경계의 예약들을 누락하는 off-by-one처럼 보인다."
lure_lines = [33, 34]

[safety]
claim = "overlapping_rows는 모든 list[tuple[int, int]]와 int 경계 입력(음수, 임의 크기 정수, bool, IntEnum 및 메서드를 재정의하지 않은 하위 타입 포함)에 대해 질의 또는 입력 행 중 하나라도 시작이 끝보다 크면 거절하고, 나머지는 [start, stop)과 교집합이 비어 있지 않은 입력 행의 0 기반 인덱스만 빠짐없이 중복 없이 원래 행 순서의 리스트로 반환한다. 빈 질의와 빈 행은 겹치지 않으며, 성공과 거절 모두 입력 리스트의 내용을 바꾸지 않는다."
justification = "빈 행은 트리에 넣지 않고 빈 질의는 먼저 종료한다. 각 내부 노드의 lower는 모든 자손 시작점의 최솟값이고 upper는 모든 자손 끝점의 최댓값이다. 따라서 upper <= start이면 모든 자손이 질의 전에 끝나고 lower >= stop이면 모든 자손이 질의 뒤에서 시작하므로 해당 하위 트리를 생략해도 겹치는 행은 없다. 비어 있지 않은 리프가 두 검사를 통과하면 두 반열린 구간의 교집합이 반드시 존재한다. 왼쪽부터 순회하여 원래 인덱스를 한 번씩만 추가하고, 모든 경계 검증은 빈 값 반환보다 앞서 수행하며 입력에는 쓰지 않는다."
guard_symbol = "_collect"
guard_lines = [31, 41]

[twin]
defect = "하위 트리의 upper가 start와 같은 경우를 가지치기에서 제외하여, 질의 시작점에서 이미 끝난 예약 리프를 겹치는 행으로 잘못 반환한다."
