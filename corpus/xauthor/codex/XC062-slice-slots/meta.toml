decoy_id = "XC062-slice-slots"
trap_kind = "bounded_input"

[bait]
apparent_defect = "하위 함수가 요청의 시작점·끝점·간격을 range에 넣고 list로 전부 물질화하므로, 큰 슬롯 구간 요청이 제한 없이 목록을 할당할 것처럼 보인다."
lure_lines = [6, 7]

[safety]
claim = "select_slots는 평범한 하위 타입을 포함한 모든 int 시작점·끝점·간격과 매 호출에서, 간격이 0이면 동기 예외로 거절하고, 그 밖에는 0부터 255까지의 슬롯 번호 목록에 같은 시작점·끝점·간격의 파이썬 슬라이스를 적용한 것과 값 및 순서가 같은 Sequence를 반환한다. 따라서 음수 인덱스, 역방향, 빈 구간, 임의로 큰 정수에서도 반환 항목 수는 항상 0 이상 256 이하이다."
justification = "공개 진입점이 slice.indices에 고정 길이 256을 전달하므로 음수 인덱스의 상대 위치를 해석하고 양 끝을 간격 방향에 맞게 잘라낸다. 양의 간격에서는 경계가 0부터 256 사이이고 음의 간격에서는 -1부터 255 사이이므로 range가 만드는 슬롯은 0부터 255 안에만 있고 중복되지 않는다. 0인 간격은 정규화 중에 거절된다. 따라서 하위 함수에 전달되는 좌표는 매 호출에서 유한한 슬롯 목록의 슬라이스와 같은 최대 256개 항목만 생성한다."
guard_symbol = "select_slots"
guard_lines = [10, 11]

[twin]
defect = "슬라이스 좌표 정규화를 우회하여 원래 정수를 하위 함수에 전달하므로 select_slots(0, 1024, 1)은 256개 상한을 넘어 1024개 항목을 할당하며 음수와 역방향의 슬라이스 의미도 깨진다."
