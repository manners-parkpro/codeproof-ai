decoy_id = "XC052-feature-subsets"
trap_kind = "bounded_input"

[bait]
apparent_defect = "하위 할당 함수가 외부 기능 플래그의 켜진 비트 수를 지수로 삼아 bytearray를 만들므로, 많은 비트를 켠 정수 하나로 크기 제한 없는 조합 버퍼를 할당할 것처럼 보인다."
lure_lines = [4, 5]

[safety]
claim = "combination_buffer는 평범한 하위 타입을 포함한 모든 int 입력과 매 호출에서, 입력의 하위 12비트 중 켜진 비트 수를 k라 할 때 길이가 정확히 2의 k제곱이고 모든 바이트가 0인 새 bytearray를 반환하며, 음수의 하위 비트도 파이썬 정수 비트 연산 의미를 따르고 상위 비트는 무시되므로 반환 길이는 항상 1 이상 4096 이하이다."
justification = "공개 진입점은 하위 할당 함수를 부르기 전에 입력 정수와 0xFFF의 비트 AND를 계산한다. 따라서 음수 및 임의 크기 정수에서도 전달값은 하위 12자리만 보존한 0 이상 4095 이하의 정수이며 켜진 비트가 최대 12개이다. 하위 함수의 왼쪽 시프트는 정확히 2의 k제곱을 만들고 bytearray의 정수 생성자는 그 길이의 새 영 버퍼를 만들기 때문에 모든 정상 호출에서 내용과 크기 계약이 성립한다."
guard_symbol = "combination_buffer"
guard_lines = [8, 10]

[twin]
defect = "공개 진입점에서 비트 마스크를 우회하므로 8191처럼 13개 비트를 켠 입력이 8192바이트를 할당하여 4096바이트 상한과 상위 비트 무시 계약을 위반한다."
