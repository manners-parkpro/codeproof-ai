decoy_id = "XC001-aligned-frame"
trap_kind = "bounded_input"

[bait]
apparent_defect = "하위 할당 함수가 전달받은 두 정수를 곱해 바로 bytearray를 생성하므로, 큰 이미지 요청이 제한 없이 메모리를 할당할 것처럼 보인다."
lure_lines = [15, 16]

[safety]
claim = "new_frame의 모든 int 치수 요청에서, 음수 치수 또는 64바이트 행 정렬을 포함한 RGBA 저장 크기가 65536바이트를 초과하는 요청은 프레임 할당 전에 거절된다. 나머지 요청은 정렬된 행 크기 곱하기 높이 바이트의 버퍼를 반환하므로 빈 프레임을 포함하여 그 길이는 0 이상 65536 이하이다."
justification = "new_frame은 먼저 두 치수의 음수를 거절하고, 폭에 픽셀당 4바이트를 곱한 뒤 64의 배수로 올림하여 실제 행 크기를 구한다. 이 행 크기와 높이의 곱을 상한과 비교한 후에만 하위 할당 함수를 호출하기 때문에, 패딩까지 포함한 최종 할당 길이가 상한을 넘을 수 없다. Python 정수 곱셈은 고정 폭 오버플로가 없으며, bool과 IntEnum 및 메서드를 재정의하지 않은 int 하위 클래스에도 같은 계산이 적용된다. 한 치수가 0이면 곱도 0이므로 큰 다른 치수 역시 빈 버퍼로 처리한다."
guard_symbol = "new_frame"
guard_lines = [6, 12]

[twin]
defect = "행 크기와 높이의 곱에 대한 상한 검사를 제거하여, 예를 들어 폭 17과 높이 513이 65664바이트를 할당한다. 더 큰 요청도 제한 없이 할당 함수에 도달한다."
