decoy_id = "XC068-ampersand-retry"
trap_kind = "idempotent_retry"

[bait]
apparent_defect = "deliver는 앰퍼샌드를 &amp;로 치환한 다음 확인 콜백의 TimeoutError를 잡고 같은 치환을 반복하므로, 응답이 유실되면 &amp;amp; 같은 중복 인코딩으로 원문이 손상되는 것으로 보인다."
lure_lines = [18, 27]

[safety]
claim = "한 스레드에서 모든 str text로 생성한 AmpersandText의 snapshot은 text와 같은 문자열 내용이다. 생성과 순차적인 공개 API 호출로 도달한 모든 상태에서, 호출 직전 문자열을 s라 하면 모든 int attempts에 대한 deliver의 정상 종료 또는 동기 예외 전파 뒤 snapshot은 attempts가 양수이면 E(s)이고 비양수이면 s이다. E는 원문에서 바로 뒤에 정확히 amp;가 오지 않는 각 &만 &amp;로 치환하고 나머지 문자는 순서와 내용 그대로 보존하는 변환이다. 호출된 각 확인 콜백 안에서 조회한 snapshot도 E(s)이다. str와 int에는 빈 문자열, 임의 유니코드 내용, 극단적인 정수 및 bool, IntEnum, IntFlag, str와 Enum 혼합형, 메서드 재정의 없는 하위 타입이 포함된다. 확인 응답의 성공, 동기 예외 및 재시도 횟수와 무관하게 성립하며 콜백은 snapshot 조회만으로 재진입할 수 있다. 반환값, 예외 타입, 콜백 자체의 외부 효과와 동시 호출은 주장하지 않는다."
justification = "_BARE_AMPERSAND의 부정 전방 탐색은 바로 뒤가 amp;인 &를 제외하므로 기존 &amp;는 그대로 남고 다른 &만 하나의 &amp;로 바뀐다. 치환 결과의 모든 &는 amp;를 바로 뒤에 가지며 다른 문자는 삭제되거나 재배열되지 않기 때문에 결과에 다시 같은 정규식을 적용해도 일치하는 자리가 없다. 따라서 E(E(s))는 E(s)이고 확인 콜백의 응답 유실로 재시도하더라도 내용은 변하지 않는다. 치환과 대입은 콜백보다 먼저 끝나므로 콜백 관측과 예외 전파 뒤에도 같은 결과이며, 비양수 attempts는 반복문 본문을 실행하지 않아 이전 내용을 보존한다."
guard_symbol = "_BARE_AMPERSAND"
guard_lines = [7, 7]

[twin]
defect = "정규식의 부정 전방 탐색을 제거하여 이미 완성된 &amp;도 다시 치환한다. 재시도마다 &amp;amp;처럼 내용이 달라지며 기존 &amp;를 포함한 원문은 첫 시도부터 손상된다."
