decoy_id = "XC018-endpoint-sweep"
trap_kind = "contract_half_open"

[bait]
apparent_defect = "종료 이벤트의 -1이 같은 시각의 +1보다 먼저 정렬되어 최대치를 갱신하기 전에 점유 수를 낮추므로, 경계에서 만나는 예약을 하나 덜 세는 것처럼 보인다."
lure_lines = [12, 19]

[safety]
claim = "peak_concurrency는 모든 list[tuple[int, int]] 입력(음수, 임의 크기 정수 및 일반 하위 타입 포함)에서 start > stop인 구간이 하나라도 있으면 거절하고, 그 외에는 반열린 구간 [start, stop)의 최대 동시 점유 수를 반환하며 빈 입력과 빈 구간만 있는 입력에는 0을 반환한다."
justification = "각 구간을 전수 검사하여 역전은 거절하고 빈 구간은 건너뛴다. 나머지 구간마다 시작에 +1, 종료에 -1을 기록하고 정수 튜플을 정렬하므로 같은 시각에는 모든 종료가 모든 시작보다 앞선다. 따라서 stop은 점유에서 제외되고 start는 포함되며, 각 시각의 시작 이벤트를 모두 처리한 누적값은 그 시각의 실제 점유 수다. 종료 처리 중에는 누적값이 감소할 뿐이고 시작 처리 중에는 마지막 값까지 증가하므로 중간 단계가 최대치를 부풀리지 않는다. Python 정수에는 고정 폭 오버플로가 없고 이벤트를 중복 제거하지 않으므로 음수, 큰 좌표 및 중복 예약에서도 이 불변식이 성립한다."
guard_symbol = "peak_concurrency"
guard_lines = [4, 20]

[twin]
defect = "동일 시각의 정렬 우선순위를 뒤집어 종료 전에 시작을 더하므로 [(0, 1), (1, 2)]처럼 실제 최대 점유가 1인 인접 예약의 최대 점유를 2로 반환한다."
