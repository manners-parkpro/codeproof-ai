decoy_id = "XC064-range-deltas"
trap_kind = "contract_half_open"

[bait]
apparent_defect = "끝 인덱스 stop에서 증감량을 바로 빼고 그 차분을 출력값보다 먼저 누적하므로, 마지막 칸의 갱신을 한 칸 일찍 취소하는 off-by-one처럼 보인다."
lure_lines = [7, 7]

[safety]
claim = "add_ranges는 모든 list[int] values와 list[tuple[int, int, int]] updates 입력(빈 리스트, 음수 및 임의 크기 정수, bool, IntEnum, 메서드를 재정의하지 않은 하위 타입 포함)에 대해 갱신 (start, stop, amount) 중 0 <= start <= stop <= len(values)를 어기는 것이 하나라도 있으면 거절하고, 나머지는 각 인덱스 i의 원래 값에 start <= i < stop인 모든 갱신의 amount를 더한 길이 len(values)의 리스트를 반환하며, 빈 구간은 아무 효과가 없고 성공과 거절 모두 두 입력의 내용을 바꾸지 않는다."
justification = "모든 갱신의 경계를 먼저 검사하므로 차분 인덱스는 길이보다 하나 큰 배열 안에 있다. _record_half_open은 start에 amount를 더하고 stop에서 같은 양을 빼므로 누적합에 대한 한 갱신의 기여는 start <= i < stop에서만 amount이다. 따라서 빈 구간의 두 기록은 서로 상쇄되고 끝 경계 이후에는 기여가 남지 않으며, 겹치는 갱신도 정수 덧셈으로 합쳐진다. 입력은 읽기만 하고 차분과 결과를 별도로 만들기 때문에 거절과 성공 모두 원본을 보존한다."
guard_symbol = "_record_half_open"
guard_lines = [4, 7]

[twin]
defect = "stop에서의 차분 상쇄를 제거해 비어 있지 않은 갱신의 효과가 stop 이후로 새고 내부의 빈 구간조차 뒤쪽 값을 바꾼다."
