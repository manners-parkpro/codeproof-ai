decoy_id = "XC040-normalized-headers"
trap_kind = "upstream_validation"

[bait]
apparent_defect = "header_positions의 딕셔너리 컴프리헨션은 정규화 결과가 같은 열 이름을 만나면 앞 열의 위치를 뒤 열의 위치로 조용히 덮어써 색인에서 열을 잃는 것처럼 보인다."
lure_lines = [17, 17]

[safety]
claim = "동시 입력 변경이 없는 header_positions 호출은 선언 타입의 모든 입력에서 각 이름에 NFKC 정규화, 양끝 공백 제거, casefold를 순서대로 적용한 키가 모두 비어 있지 않고 서로 다르면 각 키를 원래 열의 0부터 시작하는 위치에 대응시키는 딕셔너리를 반환하며, 빈 키 또는 중복 키가 하나라도 있으면 예외로 거절한다; 빈 입력에는 빈 딕셔너리를 반환하고 성공과 거절 모두 입력을 변경하지 않는다."
justification = "각 이름의 최종 키를 불변 튜플에 한 번 계산하고 _validate_keys가 그 튜플 전체를 순회하면서 빈 키와 이미 본 키를 거절하기 때문에 마지막 컴프리헨션에 도달한 키는 전부 비어 있지 않고 서로 다르다. 따라서 딕셔너리에 삽입할 때 앞 열의 위치를 덮어쓰지 않으며 enumerate의 위치가 그대로 보존된다. 빈 튜플은 두 순회를 모두 건너뛰고 입력 리스트와 문자열에는 쓰기를 수행하지 않는다."
guard_symbol = "_validate_keys"
guard_lines = [16, 16]

[twin]
defect = "정규화된 키의 검증 호출을 제거하여 공백뿐인 이름을 허용하고 서로 같은 키가 된 열들의 위치를 마지막 열의 위치로 덮어쓴다."
