decoy_id = "XC076-cleanup-receipt"
trap_kind = "exception_absorbed"

[bait]
apparent_defect = "정리 실행 함수를 감싼 except BaseException: pass가 취소와 종료를 포함한 정리 실패를 삼켜, 호출자가 실패를 알 수 없고 영수증을 기다리다 영원히 멈추는 것처럼 보인다."
lure_lines = [25, 29]

[safety]
claim = "prepare_cleanup은 모든 Callable[[], object]에 대해 콜백을 즉시 실행하지 않고 서로 독립된 미완료 Future와 실행 함수를 반환한다; 각 실행 함수는 정확히 한 번 호출하고 Future는 관찰 메서드와 cancel로만 사용하는 계약에서, 실행 시작 전에 취소가 성공하면 콜백을 호출하지 않고 취소 상태를 유지한다; 그렇지 않으면 콜백을 정확히 한 번 호출하며 콜백 실행 중에는 Future가 running이고 미완료이며 취소가 실패한다; 콜백이 어떤 object를 정상 반환하든 실행 함수는 None을 반환하고 Future는 취소되지 않은 완료 상태에서 None을 결과로 제공한다; 콜백이 어떤 동기 BaseException을 던져도 실행 함수는 예외 없이 None을 반환하며 Future는 취소되지 않은 완료 상태에서 exception으로 바로 그 예외 객체를 제공하고 result로 바로 그 객체를 전파한다; 콜백 호출로 완료된 뒤 취소는 실패하고 반복 관찰과 다른 작업의 준비 및 실행은 그 결과를 바꾸지 않는다. 실제 외부 자원 정리 성공, 예외의 traceback과 cause와 context 보존, 콜백 자체의 종료는 보장하지 않는다."
justification = "_settle은 정리 콜백을 감싼 context manager이므로 콜백 실패가 바깥의 광범위 except에 도달하기 전에 Future.set_exception으로 원래 예외 객체를 기록한다. 따라서 작업 실행 경계에서는 예외를 흡수해도 영수증의 result와 exception에는 실패가 보존된다. 정상 경로만 else에서 None을 기록하며, 실행 전 set_running_or_notify_cancel이 취소된 작업을 건너뛰고 나머지 작업의 실행 중 취소를 막는다. prepare_cleanup의 각 호출은 별개의 Future를 생성하여 결과를 분리한다."
guard_symbol = "_settle"
guard_lines = [8, 16]

[twin]
defect = "_settle의 실패 기록을 제거하여 콜백 예외가 바깥 except에서 사라진다. Future는 running 상태에 영원히 남고 result와 exception은 완료된 실패를 관찰할 수 없다."
