decoy_id = "XC061-postfix-arity"
trap_kind = "upstream_validation"

[bait]
apparent_defect = "실행부가 연산자를 만날 때마다 빈 스택 여부를 확인하지 않고 pop을 두 번 호출하므로 잘못된 후위 표기식에서 피연산자가 부족하거나, 최종 stack[-1]이 남은 피연산자를 조용히 버리는 것처럼 보인다."
lure_lines = [26, 34]

[safety]
claim = "동시 입력 변경이 없는 evaluate_postfix 호출은 선언 타입의 모든 입력에 대해 int 토큰을 피연산자로, 문자열 +, -, *를 이항 연산자로 해석한다. 모든 연산자 직전에 피연산자가 두 개 이상 있고 전체 처리 후 정확히 하나가 남는 식만 수락하여 왼쪽 피연산자와 오른쪽 피연산자 순서대로 정확한 정수 연산 결과를 반환한다. 빈 입력, 알 수 없는 문자열, 중간 피연산자 부족, 최종 잉여 피연산자는 예외로 거절한다. 성공과 거절 모두 입력을 변경하지 않는다."
justification = "_validate_program은 입력 전체를 먼저 순회하며 정수마다 깊이를 하나 늘리고 허용된 이항 연산자마다 두 피연산자가 있는지 확인한 뒤 깊이를 하나 줄인다. 따라서 통과한 식의 실제 실행 스택 길이는 검증 깊이와 각 접두부마다 같아서 두 번의 pop이 모두 가능하다. 알려지지 않은 문자열과 마지막 깊이가 1이 아닌 식을 실행 전에 거절하므로 최종 접근도 유효하며 남는 피연산자가 없다. 실행은 지역 스택에서 오른쪽 원소를 먼저 꺼내 정확한 정수 연산을 하고 입력 목록에는 쓰지 않는다."
guard_symbol = "_validate_program"
guard_lines = [4, 16]

[twin]
defect = "evaluate_postfix에서 전체 구조 검증 호출을 제거하여 [1, 2] 같은 식을 2로 조용히 수락하고, [2, 3, '?']를 곱셈으로 잘못 실행한다."
