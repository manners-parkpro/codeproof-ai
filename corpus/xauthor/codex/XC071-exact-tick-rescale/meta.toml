decoy_id = "XC071-exact-tick-rescale"
trap_kind = "upstream_validation"

[bait]
apparent_defect = "rescale_ticks의 리스트 컴프리헨션은 주파수 비율을 정수 나눗셈으로 계산하므로 정수로 표현할 수 없는 타임스탬프의 소수 부분을 조용히 버리고, 특히 음수 틱을 더 작은 정수로 바꾸는 것처럼 보인다."
lure_lines = [15, 15]

[safety]
claim = "동시 입력 변경이 없는 rescale_ticks 호출은 선언 타입의 모든 입력에서 source_hz와 target_hz가 모두 양수이고 모든 tick * target_hz / source_hz가 수학적으로 정수일 때만 수락한다. 수락하면 각 틱의 정확한 변환 정수를 원래 순서와 중복 횟수대로 리스트에 담아 반환하고, 그렇지 않으면 예외로 거절한다. 음수와 0인 틱도 같은 규칙을 따르고 정수 크기에 따른 별도 제한은 없다. 빈 입력은 두 주파수가 모두 양수일 때만 빈 리스트로 반환된다. 성공과 거절 모두 입력 리스트를 변경하지 않는다."
justification = "_validate_ticks가 먼저 두 주파수의 양수 조건을 확인하므로 나머지와 나눗셈의 분모는 항상 0보다 크다. 이어서 모든 틱과 목표 주파수의 정수 곱을 원본 주파수로 나눈 나머지가 0인지 전수 검사하기 때문에 하나라도 정수로 표현할 수 없으면 결과 계산 전에 거절된다. 따라서 실행부의 //는 양수와 음수 모두에서 소수 부분을 버리지 않고 정확한 정수 몫을 얻는다. 파이썬 정수 연산만 사용하므로 큰 값에도 부동소수점 반올림이 없고 두 순회는 입력을 읽기만 한다."
guard_symbol = "_validate_ticks"
guard_lines = [6, 10]

[twin]
defect = "상류 검증 호출을 제거하여 [1, -1]을 source_hz=3, target_hz=2로 변환하면 거절하는 대신 [0, -1]을 반환하며 표현 불가능한 타임스탬프를 조용히 내림한다."
