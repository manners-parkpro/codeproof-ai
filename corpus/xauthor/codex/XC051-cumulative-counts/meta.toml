decoy_id = "XC051-cumulative-counts"
trap_kind = "upstream_validation"

[bait]
apparent_defect = "cumulative_counts는 정렬하지 않은 samples를 bisect_right에 그대로 넘기므로 순서가 뒤섞인 측정값에서 임계값 이하인 원소 개수를 잘못 계산할 것처럼 보인다."
lure_lines = [13, 13]

[safety]
claim = "동시 입력 변경이 없는 cumulative_counts 호출은 선언 타입의 모든 samples와 limits에 대해 samples가 비감소 순서가 아니면 limits가 비어 있어도 예외로 거절한다. 비감소 순서이면 각 limit 이하인 samples 원소의 개수를 limits의 원래 순서대로 리스트에 담아 반환하며, 중복 측정값은 각각 센다. 빈 samples에는 각 limit마다 0을 반환하고 빈 limits에는 빈 리스트를 반환한다. 성공과 거절 모두 두 입력을 변경하지 않는다."
justification = "_validate_order는 모든 인접 원소 쌍의 역전을 검사하며 하나라도 발견하면 반환식에 도달하기 전에 예외를 발생시킨다. 선언된 정수의 비교는 추이적이므로 인접 역전이 없으면 전체가 비감소 순서이고, 따라서 bisect_right의 삽입 위치는 해당 임계값 이하인 모든 원소의 개수와 일치한다. 같은 값들은 오른쪽 삽입 위치까지 모두 포함되며, 빈 입력도 동일한 정의를 따른다. 검사와 조회는 입력을 읽기만 하고 새 결과 리스트를 만들기 때문에 두 입력은 변경되지 않는다."
guard_symbol = "_validate_order"
guard_lines = [6, 8]

[twin]
defect = "상류 순서 검증 호출이 제거되어 samples=[3, 1, 2], limits=[2]에서 실제 개수 2 대신 [3]을 반환하며, 비감소 순서가 아닌 입력도 거절하지 않는다."
