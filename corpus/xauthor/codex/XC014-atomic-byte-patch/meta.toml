decoy_id = "XC014-atomic-byte-patch"
trap_kind = "upstream_validation"

[bait]
apparent_defect = "바이트 버퍼에 검사 없이 차례로 대입하므로 뒤쪽 위치나 값이 범위를 벗어나면 예외 이전의 수정만 남거나 음수 위치가 끝부분을 잘못 수정할 것처럼 보인다."
lure_lines = [16, 17]

[safety]
claim = "동시 변경이 없는 apply_patch 호출에서, 선언 타입의 모든 초기 버퍼와 수정 목록에 대해 모든 위치가 0 이상 len(buffer) 미만이고 모든 값이 0 이상 255 이하이면 목록 순서대로 전부 반영한다. 하나라도 범위를 벗어나면 예외로 거절하고 초기 버퍼를 그대로 유지한다. 빈 목록은 아무것도 바꾸지 않으며 중복 위치에는 마지막 값이 남는다."
justification = "_validate_patch가 첫 대입 전에 수정 목록 전체를 순회하며 각 위치의 하한과 버퍼 길이 미만인 상한, 각 값의 바이트 범위를 검사한다. 따라서 하나라도 잘못되면 아직 쓰기가 시작되지 않은 상태에서 예외가 발생한다. 검사를 마치면 모든 위치와 값이 bytearray 대입의 유효 범위 안에 있고 대입은 길이를 바꾸지 않으므로 이후 순차 반영에는 범위 오류가 없으며 중복 위치도 목록의 마지막 값으로 결정된다. 일반 하위 타입인 bool과 IntEnum도 해당 정수 값으로 같은 검사를 거친다."
guard_symbol = "_validate_patch"
guard_lines = [6, 11]

[twin]
defect = "첫 쓰기 전의 전수 검증 호출이 제거되어 나중 항목의 범위 오류가 앞선 항목을 반영한 채 예외를 내며, 음수 위치는 거절되지 않고 버퍼 끝에서부터 해석된다."
