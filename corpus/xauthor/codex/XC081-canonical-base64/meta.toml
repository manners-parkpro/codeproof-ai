decoy_id = "XC081-canonical-base64"
trap_kind = "upstream_validation"

[bait]
apparent_defect = "decode_token은 validate=True 없이 base64.b64decode를 호출하므로 공백이나 알파벳 밖 문자를 무시하거나, 패딩에서 버려지는 비트가 0이 아닌 여러 문자열을 같은 바이트로 디코딩하여 비정규 전송 토큰을 조용히 수락할 것처럼 보인다."
lure_lines = [25, 25]

[safety]
claim = "decode_token은 선언 타입 str의 모든 값과 메서드를 재정의하지 않은 하위 타입에 대해, 입력이 표준 Base64 알파벳 A-Z, a-z, 0-9, +, /를 쓰고 필요한 = 패딩을 정확히 붙이며 버려지는 패딩 비트가 모두 0인 정규 인코딩일 때만 수락하여 그 인코딩의 원래 바이트열을 bytes로 반환한다. 빈 문자열은 빈 바이트열로 반환한다. 공백, 다른 문자, 잘못된 길이, 누락되거나 과도하거나 중간에 있는 패딩, 0이 아닌 패딩 비트는 예외로 거절한다. 입력 길이의 별도 상한은 없고 입력은 변경하지 않는다."
justification = "_validate_base64가 먼저 전체 길이를 4의 배수로 제한하고 fullmatch로 표준 알파벳 뒤에만 최대 두 개의 패딩을 허용한다. 따라서 패딩 두 개에는 두 개의 데이터 문자가, 패딩 한 개에는 세 개의 데이터 문자가 마지막 묶음에 존재한다. 이어 마지막 데이터 문자의 하위 4비트 또는 2비트가 0인지 확인하므로 디코더가 버리는 비트에도 다른 표현이 숨을 수 없다. 이 전수 검증을 통과한 문자열만 디코더에 전달되므로 기본 디코더의 관대한 문자 무시 동작으로 비정규 입력이 수락되는 경로가 없다."
guard_symbol = "_validate_base64"
guard_lines = [10, 20]

[twin]
defect = "decode_token에서 상류 검증 호출을 제거하여 AAAA!!!! 같은 알파벳 밖 문자가 포함된 입력 및 AB== 같은 0이 아닌 패딩 비트를 가진 입력을 수락한다."
